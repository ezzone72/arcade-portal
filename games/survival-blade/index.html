<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서바이벌 블레이드 - sojang ai Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; height: 100%; }
        
        .top-nav { position: absolute; top: 12px; right: 12px; z-index: 20; }
        .home-btn { background: rgba(30, 41, 59, 0.8); color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 16px; font-weight: bold; text-decoration: none; font-size: 12px; }

        .header-status { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; font-size: 12px; font-weight: bold; }
        .stat-card { background: rgba(15, 23, 42, 0.85); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
        .score-text { color: #facc15; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .modal-content { background: #1e293b; border: 2px solid #38bdf8; padding: 20px; border-radius: 16px; text-align: center; max-width: 90%; }
        .modal h2 { font-size: 24px; color: #ef4444; margin-bottom: 8px; }
        .modal p { font-size: 14px; color: #e2e8f0; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn-action { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; }
        .btn-restart { background: #38bdf8; color: #0f172a; }
        .btn-lobby { background: #64748b; color: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-status">
        <div class="stat-card">⚔️ 블레이드: <span id="blade-count" class="score-text">1개 (T1)</span></div>
        <div class="stat-card">🏆 생존: <span id="alive-count" class="score-text">10명</span></div>
    </div>

    <div class="top-nav">
        <a href="../../index.html" class="home-btn">🏠 로비</a>
    </div>

    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">GAME OVER</h2>
            <p id="modal-desc">최종 생존 랭킹: 5위</p>
            <div class="btn-group">
                <button class="btn-action btn-restart" onclick="initGame()">다시 도전</button>
                <a href="../../index.html" class="btn-action btn-lobby">로비로 이동</a>
            </div>
        </div>
    </div>

    <canvas id="bladeCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('bladeCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let player, ais = [], items = [];
let targetX = 0, targetY = 0;

class Character {
    constructor(x, y, isPlayer, name) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.speed = isPlayer ? 4 : 2.5;
        this.isPlayer = isPlayer;
        this.name = name;
        this.blades = 1;
        this.tier = 1;
        this.angle = 0;
        this.isDead = false;
    }

    update() {
        if (this.isDead) return;
        this.angle += 0.04;

        if (this.isPlayer) {
            let dx = targetX - this.x;
            let dy = targetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
        } else {
            // AI 임의 이동
            this.x += (Math.random() - 0.5) * this.speed * 2;
            this.y += (Math.random() - 0.5) * this.speed * 2;
        }

        // 화면 경계 제한
        this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
    }

    draw() {
        if (this.isDead) return;

        // 본체
        ctx.fillStyle = this.isPlayer ? '#38bdf8' : '#ef4444';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // 이름
        ctx.fillStyle = '#fff';
        ctx.font = '11px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, this.x, this.y - this.radius - 8);

        // 회전 칼날
        const bladeOrbit = 35 + this.tier * 5;
        for (let i = 0; i < this.blades; i++) {
            let bAngle = this.angle + (Math.PI * 2 / this.blades) * i;
            let bx = this.x + Math.cos(bAngle) * bladeOrbit;
            let by = this.y + Math.sin(bAngle) * bladeOrbit;

            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(bx, by, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    if (player) {
        targetX = width / 2;
        targetY = height / 2;
    }
}
window.addEventListener('resize', resize);

function handleInput(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    targetX = clientX - rect.left;
    targetY = clientY - rect.top;
}

canvas.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

function initGame() {
    resize();
    player = new Character(width / 2, height / 2, true, '나');
    targetX = width / 2;
    targetY = height / 2;

    ais = [];
    for (let i = 1; i <= 9; i++) {
        ais.push(new Character(Math.random() * width, Math.random() * height, false, `AI-${i}`));
    }

    document.getElementById('gameover-modal').style.display = 'none';
}

function render() {
    ctx.clearRect(0, 0, width, height);

    // 격자 배경
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }

    player.update();
    player.draw();

    ais.forEach(ai => {
        ai.update();
        ai.draw();
    });

    requestAnimationFrame(render);
}

initGame();
render();
</script>
</body>
</html>
