<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡다 역량검사 - 도형 회전하기</title>
    <style>
        :root {
            --primary-blue: #4f6bed;
            --primary-hover: #3b54d4;
            --bg-gray: #f4f6fa;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #333333;
            --text-sub: #666666;
            --green-accent: #00b894;
            --green-bg: #e6f7f4;
            --red-accent: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 900px;
            min-height: 650px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding: 30px 40px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            margin-bottom: 20px;
        }

        .q-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .instruction-text {
            font-size: 15px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .timer-badge {
            background-color: #fff0f0;
            color: #ff4757;
            font-size: 18px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #ff4757;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .intro-box {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background-color: #fff9db;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .intro-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .intro-desc {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-main {
            background-color: var(--green-accent);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-main:hover {
            background-color: #00997b;
            transform: translateY(-2px);
        }

        .game-layout {
            display: flex;
            width: 100%;
            gap: 30px;
            flex: 1;
            align-items: center;
        }

        .display-area {
            flex: 1;
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 320px;
            overflow: hidden;
        }

        .canvas-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-box.before { background-color: #ffffff; }
        .canvas-box.after { background-color: var(--green-bg); }

        .canvas-box label {
            position: absolute;
            bottom: 15px;
            font-size: 13px;
            color: #888888;
            font-weight: 600;
        }

        .arrow-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green-accent);
            font-size: 28px;
            font-weight: bold;
        }

        .control-area {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .transform-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-trans {
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            height: 80px;
        }

        .btn-trans:hover {
            border-color: var(--green-accent);
            background-color: #f0fcf9;
        }

        .btn-trans svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--green-accent);
            stroke-width: 2.2;
            margin-bottom: 6px;
        }

        .btn-trans span {
            font-size: 11px;
            color: #555;
            font-weight: 600;
            text-align: center;
        }

        .history-box {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 12px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            flex: 1;
        }

        .slot {
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #bbb;
            font-size: 14px;
        }

        .slot.filled { border-color: var(--green-accent); }

        .slot-icon {
            width: 22px;
            height: 22px;
            stroke: var(--green-accent);
            stroke-width: 2.2;
            fill: none;
        }

        .click-count-box {
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 8px;
        }

        .click-count-title { font-size: 10px; color: #888; }
        .click-count-num { font-size: 20px; font-weight: 800; color: #333; margin-bottom: 6px; }

        .btn-sub-control {
            width: 100%;
            background-color: #f1f3f5;
            border: none;
            border-radius: 4px;
            padding: 4px 0;
            font-size: 11px;
            color: #555;
            cursor: pointer;
            margin-top: 2px;
            font-weight: 600;
        }

        .bottom-bar { display: flex; justify-content: center; margin-top: 20px; width: 100%; }

        .btn-submit {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 60px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .result-summary-box {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 30px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .score-large {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-blue);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar" id="headerBar" style="display: none;">
        <div>
            <span class="q-number" id="qNumberDisplay">1</span>
            <span class="instruction-text" style="margin-left: 15px;">주어지는 글자나 도형을 목표하는 모양으로 만들어 주세요.</span>
        </div>
        <div class="timer-badge" id="timerDisplay">03:00</div>
    </div>

    <div class="screen active" id="screenStart">
        <div class="intro-box">
            <div class="icon-box">🔄</div>
            <h2 class="intro-title">도형 회전하기</h2>
            <h3 style="font-size: 18px; color: #555; margin-bottom: 20px;">실전을 시작할게요.</h3>
            <p class="intro-desc">
                글자나 도형을 목표하는 모양으로 만들어 주세요.<br>
                실전은 총 2개의 라운드로 구성되어 있습니다.<br>
                응답 시간은 라운드마다 3분이 제공됩니다.<br>
                최대한 빠르고 정확하게 많은 문제를 풀어 주세요.
            </p>
            <div id="startTimerMessage" style="color: var(--primary-blue); font-weight: 700; margin-bottom: 16px; min-height: 24px;"></div>
            <button class="btn-main" id="btnStartGame" onclick="onClickRealStart()">실전 시작하기</button>
        </div>
    </div>

    <div class="screen" id="screenRoundIntro">
        <div class="intro-box">
            <h2 class="intro-title" id="roundIntroTitle">도형 회전하기 - 라운드 1</h2>
            <p class="intro-desc" id="roundIntroDesc" style="font-size: 16px; margin-top: 30px; line-height: 2;"></p>
            <p style="margin-top: 15px; color: var(--primary-blue); font-weight: 600; font-size: 14px;" id="introTimerText">10초가 지나면 자동으로 시작합니다.</p>
        </div>
    </div>

    <div class="screen" id="screenGame">
        <div class="game-layout">
            <div class="display-area">
                <div class="canvas-box before">
                    <canvas id="canvasBefore" width="180" height="180"></canvas>
                    <label>전</label>
                </div>
                <div class="arrow-divider">➔</div>
                <div class="canvas-box after">
                    <canvas id="canvasAfter" width="180" height="180"></canvas>
                    <label>후</label>
                </div>
            </div>

            <div class="control-area">
                <div class="transform-buttons">
                    <button class="btn-trans" onclick="applyTransform('rotL')">
                        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8z"/></svg>
                        <span>왼쪽 45° 회전</span>
                    </button>
                    <button class="btn-trans" onclick="applyTransform('rotR')">
                        <svg viewBox="0 0 24 24"><path d="M12 4V1l4 4-4 4V6c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8L5.24 16.26C4.46 15.03 4 13.57 4 12c0-4.42-3.58-8-8-8z"/></svg>
                        <span>오른쪽 45° 회전</span>
                    </button>
                    <button class="btn-trans" onclick="applyTransform('flipH')">
                        <svg viewBox="0 0 24 24"><path d="M12 2v20M8 6l-5 6 5 6V6zM16 6l5 6-5 6V6z" stroke-dasharray="2 2"/></svg>
                        <span>좌우반전</span>
                    </button>
                    <button class="btn-trans" onclick="applyTransform('flipV')">
                        <svg viewBox="0 0 24 24"><path d="M2 12h20M6 8l6-5 6 5H6zM6 16l6 5 6-5H6z" stroke-dasharray="2 2"/></svg>
                        <span>상하반전</span>
                    </button>
                </div>

                <div class="history-box">
                    <div class="slots-grid" id="slotsGrid"></div>
                    <div class="click-count-box">
                        <span class="click-count-title">남은 클릭 횟수</span>
                        <span class="click-count-num" id="remClicks">8</span>
                        <button class="btn-sub-control" onclick="undoTransform()">하나 지움</button>
                        <button class="btn-sub-control" onclick="resetTransforms()">전체 초기화</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn-submit" onclick="submitAnswer()">답안 제출</button>
        </div>
    </div>

    <div class="screen" id="screenResult">
        <div class="intro-box" style="max-width: 600px;">
            <div class="icon-box">🏆</div>
            <h2 class="intro-title">테스트가 완료되었습니다</h2>
            
            <div class="result-summary-box">
                <p style="color: var(--text-sub); font-size: 16px;">최종 정답 개수</p>
                <div class="score-large" id="resultScoreText">0 / 40</div>
                <p style="color: var(--text-sub); font-size: 14px;" id="resultAccuracyText">정답률: 0%</p>
            </div>

            <button class="btn-main" style="margin-top: 30px;" onclick="location.reload()">처음부터 다시하기</button>
        </div>
    </div>
</div>

<script>
    let currentRound = 1;
    let currentQuestionIndex = 0;
    
    const MAX_CLICKS_PER_QUESTION = 8;
    let remainingClicks = MAX_CLICKS_PER_QUESTION;

    let roundTimeLeft = 180;
    let gameTimerInterval = null;
    let autoStartTimer = null;
    let userOps = [];

    let examHistory = [];

    const OP_NAME = {
        rotL: '왼쪽45°',
        rotR: '오른쪽45°',
        flipH: '좌우반전',
        flipV: '상하반전'
    };

    const OP_ICONS = {
        rotL: `<svg class="slot-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8z"/></svg>`,
        rotR: `<svg class="slot-icon" viewBox="0 0 24 24"><path d="M12 4V1l4 4-4 4V6c-3.31 0-6 2.69-6 6 0 1.01-.25 1.97-.7 2.8L5.24 16.26C4.46 15.03 4 13.57 4 12c0-4.42-3.58-8-8-8z"/></svg>`,
        flipH: `<svg class="slot-icon" viewBox="0 0 24 24"><path d="M12 2v20M8 6l-5 6 5 6V6zM16 6l5 6-5 6V6z"/></svg>`,
        flipV: `<svg class="slot-icon" viewBox="0 0 24 24"><path d="M2 12h20M6 8l6-5 6 5H6zM6 16l6 5 6-5H6z"/></svg>`
    };

    let currentQuestionData = null;
    const R1_CHARACTERS = ['F', 'G', 'J', 'Q', 'R', 'P', '4', '7', 'e', 'a', 'y', 'B', 'K', 'L'];

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function onClickRealStart() {
        const btn = document.getElementById('btnStartGame');
        const msg = document.getElementById('startTimerMessage');
        if (btn) btn.style.display = 'none';
        
        let rem = 6;
        if (msg) msg.innerText = `${rem}초 후 시작합니다.`;

        let introCnt = setInterval(() => {
            rem--;
            if (rem > 0) {
                if (msg) msg.innerText = `${rem}초 후 시작합니다.`;
            } else {
                clearInterval(introCnt);
                examHistory = [];
                startRoundIntro(1);
            }
        }, 1000);
    }

    function startRoundIntro(roundNum) {
        currentRound = roundNum;
        document.getElementById('headerBar').style.display = 'none';
        showScreen('screenRoundIntro');

        const title = document.getElementById('roundIntroTitle');
        const desc = document.getElementById('roundIntroDesc');

        if (roundNum === 1) {
            title.innerText = "도형 회전하기 - 라운드 1";
            desc.innerHTML = `1. 라운드 1은 알파벳이 등장합니다.<br>2. 머릿속으로 회전을 상상하여 조작을 등록해 주세요.`;
        } else {
            title.innerText = "도형 회전하기 - 라운드 2";
            desc.innerHTML = `1. 라운드 2는 사각형 패턴이 등장합니다.<br>2. 패턴 변환을 상상하여 조작을 등록해 주세요.`;
        }

        let elapsed = 0;
        clearInterval(autoStartTimer);
        autoStartTimer = setInterval(() => {
            elapsed += 1;
            document.getElementById('introTimerText').innerText = `${10 - elapsed}초가 지나면 자동으로 시작합니다.`;

            if (elapsed >= 10) {
                clearInterval(autoStartTimer);
                startActualRound();
            }
        }, 1000);
    }

    function startActualRound() {
        clearInterval(autoStartTimer);
        currentQuestionIndex = 0;
        roundTimeLeft = 180;

        document.getElementById('headerBar').style.display = 'flex';
        showScreen('screenGame');

        startTimer();
        loadQuestion();
    }

    function startTimer() {
        clearInterval(gameTimerInterval);
        updateTimerDisplay();
        gameTimerInterval = setInterval(() => {
            roundTimeLeft--;
            updateTimerDisplay();
            if (roundTimeLeft <= 0) {
                clearInterval(gameTimerInterval);
                finishRound();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = String(Math.floor(roundTimeLeft / 60)).padStart(2, '0');
        const s = String(roundTimeLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    function loadQuestion() {
        if (currentQuestionIndex >= 20) {
            finishRound();
            return;
        }

        document.getElementById('qNumberDisplay').innerText = currentQuestionIndex + 1;
        userOps = [];
        remainingClicks = MAX_CLICKS_PER_QUESTION;

        updateSlotsUI();
        updateClicksUI();

        currentQuestionData = generateQuestion(currentRound, currentQuestionIndex);
        renderCanvases();
    }

    function generateQuestion(round, index) {
        let solutionOps = [];

        const easyPool = [
            ['rotR'], ['rotL'], ['rotR', 'rotR'], ['rotL', 'rotL'], ['flipH'], ['flipV']
        ];
        const midPool = [
            ['rotR', 'flipH'], ['rotL', 'flipV'], ['rotR', 'rotR', 'flipH'], 
            ['rotL', 'flipV'], ['rotR', 'flipH'], ['rotL', 'rotL', 'flipV']
        ];
        const hardPool = [
            ['rotR', 'flipH', 'flipV'],
            ['rotL', 'rotL', 'flipH'],
            ['rotR', 'rotR', 'flipV'],
            ['rotL', 'flipH', 'flipV'],
            ['rotR', 'flipH', 'rotR'],
            ['rotL', 'flipV', 'flipH'],
            ['rotL', 'flipH', 'rotR']
        ];

        if (index < 5) {
            solutionOps = easyPool[Math.floor(Math.random() * easyPool.length)];
        } else if (index < 12) {
            solutionOps = midPool[Math.floor(Math.random() * midPool.length)];
        } else {
            solutionOps = hardPool[Math.floor(Math.random() * hardPool.length)];
        }

        if (round === 1) {
            const randomChar = R1_CHARACTERS[Math.floor(Math.random() * R1_CHARACTERS.length)];
            return {
                type: 'char',
                char: randomChar,
                solutionOps: solutionOps
            };
        } else {
            let grid = Array(16).fill(0);
            let fillCount = 5 + Math.floor(Math.random() * 5);
            while (fillCount > 0) {
                let rIdx = Math.floor(Math.random() * 16);
                if (grid[rIdx] === 0) {
                    grid[rIdx] = 1;
                    fillCount--;
                }
            }
            return {
                type: 'grid',
                grid: grid,
                solutionOps: solutionOps
            };
        }
    }

    function renderCanvases() {
        renderState('canvasAfter', currentQuestionData, currentQuestionData.solutionOps);
        renderState('canvasBefore', currentQuestionData, []); 
    }

    function renderState(canvasId, qData, ops) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(w / 2, h / 2);

        ops.forEach(op => {
            if (op === 'rotL') ctx.rotate(-Math.PI / 4);
            else if (op === 'rotR') ctx.rotate(Math.PI / 4);
            else if (op === 'flipH') ctx.scale(-1, 1);
            else if (op === 'flipV') ctx.scale(1, -1);
        });

        if (qData.type === 'char') {
            ctx.fillStyle = "#1e1e1e";
            ctx.font = "bold 90px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(qData.char, 0, 5);
        } else if (qData.type === 'grid') {
            const size = 110;
            const cellSize = size / 4;
            ctx.translate(-size / 2, -size / 2);

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    let idx = r * 4 + c;
                    ctx.strokeStyle = "#a0a0a0";
                    ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    if (qData.grid[idx] === 1) {
                        ctx.fillStyle = "#7f8c8d";
                        ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
                    }
                }
            }
        }
        ctx.restore();
    }

    function applyTransform(opType) {
        if (userOps.length >= 8 || remainingClicks <= 0) return;
        userOps.push(opType);
        remainingClicks--;
        updateSlotsUI();
        updateClicksUI();
    }

    function undoTransform() {
        if (userOps.length === 0) return;
        userOps.pop();
        remainingClicks = Math.min(MAX_CLICKS_PER_QUESTION, remainingClicks + 1);
        updateSlotsUI();
        updateClicksUI();
    }

    function resetTransforms() {
        if (userOps.length === 0) return;
        remainingClicks += userOps.length;
        userOps = [];
        updateSlotsUI();
        updateClicksUI();
    }

    function updateSlotsUI() {
        const grid = document.getElementById('slotsGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (i < userOps.length) {
                slot.classList.add('filled');
                slot.innerHTML = OP_ICONS[userOps[i]];
            } else {
                slot.innerText = i + 1;
            }
            grid.appendChild(slot);
        }
    }

    function updateClicksUI() {
        document.getElementById('remClicks').innerText = remainingClicks;
    }

    function submitAnswer() {
        const isCorrect = checkAnswerCorrectness(userOps, currentQuestionData.solutionOps);

        examHistory.push({
            round: currentRound,
            index: currentQuestionIndex + 1,
            userOps: [...userOps],
            solutionOps: [...currentQuestionData.solutionOps],
            isCorrect: isCorrect
        });

        currentQuestionIndex++;
        loadQuestion();
    }

    function checkAnswerCorrectness(uOps, sOps) {
        function getFinalMatrix(ops) {
            let a = 1, b = 0;
            let c = 0, d = 1;

            const cos45 = Math.SQRT1_2;
            const sin45 = Math.SQRT1_2;

            ops.forEach(op => {
                let na = a, nb = b, nc = c, nd = d;

                if (op === 'rotR') {
                    na = a * cos45 - b * sin45;
                    nb = a * sin45 + b * cos45;
                    nc = c * cos45 - d * sin45;
                    nd = c * sin45 + d * cos45;
                } else if (op === 'rotL') {
                    na = a * cos45 + b * sin45;
                    nb = -a * sin45 + b * cos45;
                    nc = c * cos45 + d * sin45;
                    nd = -c * sin45 + d * cos45;
                } else if (op === 'flipH') {
                    na = -a;
                    nc = -c;
                } else if (op === 'flipV') {
                    nb = -b;
                    nd = -d;
                }

                a = na; b = nb; c = nc; d = nd;
            });

            return { a, b, c, d };
        }

        const uM = getFinalMatrix(userOps);
        const sM = getFinalMatrix(sOps);

        const eps = 0.001;
        return (Math.abs(uM.a - sM.a) < eps &&
                Math.abs(uM.b - sM.b) < eps &&
                Math.abs(uM.c - sM.c) < eps &&
                Math.abs(uM.d - sM.d) < eps);
    }

    function finishRound() {
        clearInterval(gameTimerInterval);
        if (currentRound === 1) {
            startRoundIntro(2);
        } else {
            showResultView();
        }
    }

    function showResultView() {
        document.getElementById('headerBar').style.display = 'none';
        showScreen('screenResult');

        const correctCount = examHistory.filter(h => h.isCorrect).length;
        const totalCount = examHistory.length;
        const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

        document.getElementById('resultScoreText').innerText = `${correctCount} / ${totalCount}`;
        document.getElementById('resultAccuracyText').innerText = `정답률: ${accuracy}%`;
    }

    updateSlotsUI();
</script>
