<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 역량검사 대비 - N-Back 연습 오락실</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* 클릭 시 텍스트 드래그 방지 */
        }
        .game-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 360px;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }
        .display-box {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            background-color: #2b3a4a;
            color: #ffffff;
            font-size: 72px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 16px 10px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.05s ease, background-color 0.2s, border-color 0.1s;
            outline: none;
        }
        /* 클릭 시 꾹 눌리는 물리 효과 */
        button:active:not(:disabled) {
            transform: scale(0.93);
        }
        .btn-match { 
            background-color: #28a745; 
            color: white; 
        }
        .btn-match:hover:not(:disabled) { background-color: #218838; }
        
        .btn-differ { 
            background-color: #dc3545; 
            color: white; 
        }
        .btn-differ:hover:not(:disabled) { background-color: #c82333; }

        /* 클릭해서 내가 선택한 버튼 강조 스타일 */
        .btn-selected {
            border-color: #111111 !important;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transform: scale(0.96);
        }

        .btn-start { 
            background-color: #007bff; 
            color: white; 
            width: 100%; 
            margin-top: 15px; 
            border: none;
        }
        .btn-start:hover:not(:disabled) { background-color: #0069d9; }
        
        button:disabled { 
            opacity: 0.5;
            cursor: not-allowed; 
        }
        
        .result-msg {
            height: 28px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>N-Back (2-Back) 연습</h2>
    <div class="info-bar">
        <span>남은 문제: <span id="rem-count">10</span></span>
        <span>점수: <span id="score">0</span></span>
    </div>

    <div class="display-box" id="display-box">?</div>
    <div class="result-msg" id="result-msg"></div>

    <div class="btn-group">
        <button class="btn-match" id="btn-match" onclick="checkAnswer(true)" disabled>일치 (SAME)</button>
        <button class="btn-differ" id="btn-differ" onclick="checkAnswer(false)" disabled>불일치 (DIFFERENT)</button>
    </div>

    <button class="btn-start" id="btn-start" onclick="startGame()">게임 시작 (1회 차감)</button>
</div>

<script>
    const N = 2; // 2-Back 설정
    const symbols = ['★', '▲', '■', '♥', '◆'];
    const totalRounds = 10;

    let sequence = [];
    let currentIndex = 0;
    let score = 0;
    let timer = null;
    let answered = false;

    function startGame() {
        sequence = [];
        currentIndex = 0;
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('result-msg').innerText = '';
        document.getElementById('btn-start').disabled = true;
        
        // 시퀀스 생성 (일치 확률 약 35%)
        for (let i = 0; i < totalRounds + N; i++) {
            if (i >= N && Math.random() < 0.35) {
                sequence.push(sequence[i - N]);
            } else {
                sequence.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
        }

        nextTurn();
    }

    function nextTurn() {
        if (currentIndex >= sequence.length) {
            endGame();
            return;
        }

        answered = false;

        // 기존 선택 클래스 제거
        const btnMatch = document.getElementById('btn-match');
        const btnDiffer = document.getElementById('btn-differ');
        btnMatch.classList.remove('btn-selected');
        btnDiffer.classList.remove('btn-selected');

        const currentSymbol = sequence[currentIndex];
        document.getElementById('display-box').innerText = currentSymbol;
        document.getElementById('rem-count').innerText = sequence.length - currentIndex;

        // 2-back 판단 가능 구간부터 버튼 활성화
        if (currentIndex >= N) {
            btnMatch.disabled = false;
            btnDiffer.disabled = false;
            document.getElementById('result-msg').innerText = "";
        } else {
            btnMatch.disabled = true;
            btnDiffer.disabled = true;
            document.getElementById('result-msg').innerText = "기억하세요...";
            document.getElementById('result-msg').style.color = "#555";
        }

        // 1.8초 제한시간 타이머
        timer = setTimeout(() => {
            if (currentIndex >= N && !answered) {
                document.getElementById('result-msg').innerText = "⏱️ 시간 초과!";
                document.getElementById('result-msg').style.color = "orange";
            }
            currentIndex++;
            nextTurn();
        }, 1800);
    }

    function checkAnswer(userSaysMatch) {
        // 이미 답변했거나 N-back 미도달 시 동작 안 함
        if (answered || currentIndex < N) return;
        
        answered = true;

        const btnMatch = document.getElementById('btn-match');
        const btnDiffer = document.getElementById('btn-differ');

        // 1. 즉시 두 버튼 비활성화 (연타 방지)
        btnMatch.disabled = true;
        btnDiffer.disabled = true;

        // 2. 내가 누른 버튼 시각적 강조 (검은 테두리)
        if (userSaysMatch) {
            btnMatch.classList.add('btn-selected');
        } else {
            btnDiffer.classList.add('btn-selected');
        }

        // 3. 진동 피드백 (모바일 지원 기기)
        if (navigator.vibrate) {
            navigator.vibrate(40);
        }

        // 4. 정답 판정
        const isMatch = (sequence[currentIndex] === sequence[currentIndex - N]);

        if (userSaysMatch === isMatch) {
            score += 10;
            document.getElementById('result-msg').innerText = "⭕ 정답!";
            document.getElementById('result-msg').style.color = "#28a745";
        } else {
            document.getElementById('result-msg').innerText = "❌ 오답!";
            document.getElementById('result-msg').style.color = "#dc3545";
        }

        document.getElementById('score').innerText = score;
    }

    function endGame() {
        clearTimeout(timer);
        document.getElementById('display-box').innerText = "FIN";
        document.getElementById('result-msg').innerText = `게임 종료! 최종 점수: ${score}점`;
        document.getElementById('result-msg').style.color = "#007bff";
        
        const btnMatch = document.getElementById('btn-match');
        const btnDiffer = document.getElementById('btn-differ');
        btnMatch.classList.remove('btn-selected');
        btnDiffer.classList.remove('btn-selected');
        btnMatch.disabled = true;
        btnDiffer.disabled = true;
        
        document.getElementById('btn-start').disabled = false;
    }
</script>

</body>
</html>
