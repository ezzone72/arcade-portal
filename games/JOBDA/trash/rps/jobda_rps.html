<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 역량검사 - 가위바위보 게임</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 440px;
        }
        .top-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
            color: #007bff;
        }
        .mode-toggle-btn {
            background: #e2e8f0;
            color: #2b3a4a;
            border: 1px solid #cbd5e0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-toggle-btn.practice {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }
        .timer-gauge-bg {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .timer-gauge-fill {
            height: 100%;
            width: 100%;
            background: #dc3545;
        }

        /* 게임 스테이지 박스 */
        .game-stage {
            background: #2b3a4a;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            color: white;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .mission-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 6px;
            display: inline-block;
        }
        .mission-win { color: #28a745; background: rgba(40, 167, 69, 0.15); }
        .mission-lose { color: #dc3545; background: rgba(220, 53, 69, 0.15); }
        .mission-draw { color: #ffc107; background: rgba(255, 193, 7, 0.15); }

        .opponent-display {
            font-size: 56px;
            margin: 10px 0;
        }
        .opponent-label {
            font-size: 12px;
            color: #a0aec0;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 입력 버튼 그룹 */
        .choice-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button.choice-btn {
            flex: 1;
            padding: 14px 8px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background-color: #4a5568;
            transition: transform 0.05s, background-color 0.2s;
        }
        button.choice-btn:active:not(:disabled) { transform: scale(0.94); }
        button.choice-btn:hover:not(:disabled) { background-color: #718096; }
        
        .btn-start, .btn-review {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-start { background-color: #007bff; color: white; }
        .btn-review { background-color: #17a2b8; color: white; display: none; }

        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-msg { height: 28px; margin-top: 10px; font-size: 18px; font-weight: bold; }
        .key-hint { font-size: 11px; color: #718096; margin-top: 8px; }

        /* 오답 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 410px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-content h3 { margin-top: 0; color: #2b3a4a; text-align: center; }
        
        .review-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-left: 5px solid #dc3545;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .review-card .round-title { font-weight: bold; color: #333; margin-bottom: 4px; }
        .review-card .detail { margin: 3px 0; color: #555; }
        .review-card .reason { color: #d9534f; font-weight: bold; margin-top: 4px; }
        
        .close-btn {
            width: 100%;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="top-tools">
        <span>잡다 가위바위보</span>
        <button class="mode-toggle-btn" id="mode-btn" onclick="togglePracticeMode()">🔥 실전 모드 (2초)</button>
    </div>

    <div class="info-bar">
        <span>진행: <span id="current-step">0</span> / 20</span>
        <span>점수: <span id="score">0</span></span>
    </div>

    <div class="timer-gauge-bg">
        <div class="timer-gauge-fill" id="timer-gauge"></div>
    </div>

    <div class="game-stage">
        <div class="opponent-label">상대방의 패</div>
        <div id="mission-container">
            <div class="mission-text" id="mission-text">준비 중...</div>
        </div>
        <div class="opponent-display" id="opponent-sign">✊</div>
    </div>

    <div class="result-msg" id="result-msg"></div>

    <div class="choice-group">
        <button class="choice-btn" id="btn-scissors" onclick="playerChoice('scissors')" disabled>✌️ 가위 (←)</button>
        <button class="choice-btn" id="btn-rock" onclick="playerChoice('rock')" disabled>✊ 바위 (↑)</button>
        <button class="choice-btn" id="btn-paper" onclick="playerChoice('paper')" disabled>🖐️ 보 (→)</button>
    </div>

    <button class="btn-start" id="btn-start" onclick="startGame()">테스트 시작 (20문항)</button>
    <button class="btn-review" id="btn-review" onclick="toggleModal(true)">📋 틀린 문제 복기 리포트</button>
    <div class="key-hint">키보드 단축키: [← 가위] / [↑ 바위] / [→ 보]</div>
</div>

<div class="modal-overlay" id="review-modal">
    <div class="modal-content">
        <h3>📋 틀린 문제 복기 리포트</h3>
        <div id="review-list"></div>
        <button class="close-btn" onclick="toggleModal(false)">닫기</button>
    </div>
</div>

<script>
    const totalRounds = 20;
    let currentRound = 0;
    let score = 0;
    let timer = null;
    let answered = false;

    // 모드 설정 (실전: 2초 / 연습: 4초)
    let isPracticeMode = false;
    let timeLimitMs = 2000;

    let currentRoundData = {};
    let wrongQuestions = [];

    const signs = ['scissors', 'rock', 'paper'];
    const signEmojis = { scissors: '✌️', rock: '✊', paper: '🖐️' };
    const signNames = { scissors: '가위', rock: '바위', paper: '보' };
    
    const missions = [
        { type: 'win', text: '✨ 이기는 패를 내세요!', style: 'mission-win' },
        { type: 'lose', text: '💧 지는 패를 내세요!', style: 'mission-lose' },
        { type: 'draw', text: '🤝 비기는 패를 내세요!', style: 'mission-draw' }
    ];

    function togglePracticeMode() {
        if (currentRound > 0 && currentRound < totalRounds) return;

        isPracticeMode = !isPracticeMode;
        const btn = document.getElementById('mode-btn');

        if (isPracticeMode) {
            timeLimitMs = 4000; // 2배 늘린 연습 모드
            btn.innerText = "⚡ 연습 모드 (4초)";
            btn.classList.add('practice');
        } else {
            timeLimitMs = 2000; // 실제 환경 밀리초
            btn.innerText = "🔥 실전 모드 (2초)";
            btn.classList.remove('practice');
        }
    }

    function resetTimerGauge() {
        const gauge = document.getElementById('timer-gauge');
        gauge.style.transition = 'none';
        gauge.style.width = '100%';
        void gauge.offsetWidth;
        gauge.style.transition = `width ${timeLimitMs / 1000}s linear`;
        gauge.style.width = '0%';
    }

    function startGame() {
        currentRound = 0;
        score = 0;
        wrongQuestions = [];
        document.getElementById('score').innerText = score;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('mode-btn').disabled = true;
        document.getElementById('btn-review').style.display = 'none';
        nextRound();
    }

    function nextRound() {
        if (currentRound >= totalRounds) {
            endGame();
            return;
        }

        currentRound++;
        answered = false;
        document.getElementById('current-step').innerText = currentRound;
        document.getElementById('result-msg').innerText = "";

        // 랜덤 미션 및 상대 패 선정
        const mission = missions[Math.floor(Math.random() * missions.length)];
        const opponentSign = signs[Math.floor(Math.random() * signs.length)];

        // 정답 계산
        let correctSign = '';
        if (mission.type === 'win') {
            if (opponentSign === 'scissors') correctSign = 'rock';
            else if (opponentSign === 'rock') correctSign = 'paper';
            else correctSign = 'scissors';
        } else if (mission.type === 'lose') {
            if (opponentSign === 'scissors') correctSign = 'paper';
            else if (opponentSign === 'rock') correctSign = 'scissors';
            else correctSign = 'rock';
        } else {
            correctSign = opponentSign;
        }

        currentRoundData = {
            round: currentRound,
            missionText: mission.text,
            missionType: mission.type,
            opponentSign: opponentSign,
            correctSign: correctSign
        };

        // UI 반영
        const missionEl = document.getElementById('mission-text');
        missionEl.className = `mission-text ${mission.style}`;
        missionEl.innerText = mission.text;
        document.getElementById('opponent-sign').innerText = signEmojis[opponentSign];

        setButtonsEnabled(true);
        resetTimerGauge();

        timer = setTimeout(() => {
            if (!answered) {
                handleTimeout();
            }
        }, timeLimitMs);
    }

    function setButtonsEnabled(enabled) {
        document.getElementById('btn-scissors').disabled = !enabled;
        document.getElementById('btn-rock').disabled = !enabled;
        document.getElementById('btn-paper').disabled = !enabled;
    }

    function handleTimeout() {
        answered = true;
        setButtonsEnabled(false);
        document.getElementById('result-msg').innerText = "⏱️ 시간 초과!";
        document.getElementById('result-msg').style.color = "orange";

        wrongQuestions.push({
            ...currentRoundData,
            userChoice: "시간 초과",
            reason: `제한시간(${timeLimitMs / 1000}초) 내에 입력하지 못했습니다.`
        });

        setTimeout(nextRound, 500);
    }

    function playerChoice(choice) {
        if (answered) return;
        answered = true;
        clearTimeout(timer);
        setButtonsEnabled(false);

        const isCorrect = (choice === currentRoundData.correctSign);

        if (isCorrect) {
            score += 10;
            document.getElementById('result-msg').innerText = "⭕ 정답!";
            document.getElementById('result-msg').style.color = "#28a745";
        } else {
            document.getElementById('result-msg').innerText = "❌ 오답!";
            document.getElementById('result-msg').style.color = "#dc3545";

            wrongQuestions.push({
                ...currentRoundData,
                userChoice: signNames[choice],
                reason: `상대 패(${signNames[currentRoundData.opponentSign]})에게 [${currentRoundData.missionText.replace(/[✨💧🤝]/g, '').trim()}] 조건에 맞는 정답은 [${signNames[currentRoundData.correctSign]}]입니다.`
            });
        }

        document.getElementById('score').innerText = score;
        setTimeout(nextRound, 400);
    }

    function endGame() {
        clearTimeout(timer);
        const gauge = document.getElementById('timer-gauge');
        gauge.style.transition = 'none';
        gauge.style.width = '0%';

        document.getElementById('result-msg').innerText = `테스트 종료! 최종 점수: ${score}점`;
        document.getElementById('result-msg').style.color = "#007bff";
        document.getElementById('btn-start').disabled = false;
        document.getElementById('mode-btn').disabled = false;

        if (wrongQuestions.length > 0) {
            document.getElementById('btn-review').style.display = 'block';
        } else {
            document.getElementById('result-msg').innerText += " (만점!)";
        }
    }

    function renderReviewList() {
        const container = document.getElementById('review-list');
        container.innerHTML = "";

        wrongQuestions.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML = `
                <div class="round-title">📌 문제 ${item.round}번 복기</div>
                <div class="detail">· 미션: <b>${item.missionText}</b></div>
                <div class="detail">· 상대 패: <b>${signEmojis[item.opponentSign]} ${signNames[item.opponentSign]}</b></div>
                <div class="detail">· 내 선택: <b>${item.userChoice}</b></div>
                <div class="detail">· 정답: <b style="color:#28a745">${signNames[item.correctSign]}</b></div>
                <div class="reason">💡 분석: ${item.reason}</div>
            `;
            container.appendChild(card);
        });
    }

    function toggleModal(show) {
        if (show) renderReviewList();
        document.getElementById('review-modal').style.display = show ? 'flex' : 'none';
    }

    // 키보드 단축키 바인딩 (←: 가위, ↑: 바위, →: 보)
    window.addEventListener('keydown', (e) => {
        if (document.getElementById('btn-scissors').disabled) return;
        if (e.key === 'ArrowLeft') playerChoice('scissors');
        if (e.key === 'ArrowUp') playerChoice('rock');
        if (e.key === 'ArrowRight') playerChoice('paper');
    });
</script>

</body>
</html>
