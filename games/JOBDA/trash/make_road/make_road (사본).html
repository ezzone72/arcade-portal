<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길 만들기 - 도착 우선 수정 버전</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    max-width: 900px;
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #334155;
  }
  h1 { text-align: center; font-size: 1.45rem; margin-bottom: 2px; }
  .sub { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 14px; }

  .info {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .badge {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .badge b { color: #fbbf24; }

  .btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
  }
  .p { background: #3b82f6; color: #fff; }
  .s { background: #334155; color: #e2e8f0; }
  .g { background: #16a34a; color: #fff; }

  #cv {
    display: block;
    margin: 0 auto;
    background: #0f172a;
    border: 3px solid #475569;
    border-radius: 8px;
    cursor: crosshair;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 10px;
  }

  .fb {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #0f172a;
    border-left: 4px solid #64748b;
    display: none;
    line-height: 1.5;
    font-size: 0.9rem;
  }
  .fb.show { display: block; }
  .fb.ok { border-left-color: #22c55e; }
  .fb.no { border-left-color: #ef4444; }

  .tip {
    background: rgba(59,130,246,0.12);
    border-left: 4px solid #3b82f6;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 0.84rem;
    margin-bottom: 12px;
    line-height: 1.55;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>길 만들기 게임</h1>
  <p class="sub">대각선 울타리 반사 · 자기 손님 도착 시 즉시 정지 (울타리 무시)</p>

  <div class="tip">
    <b>울타리 조작</b> : 클릭 1회 → <span style="color:#f87171">/</span> &nbsp;|&nbsp; 클릭 2회 → <span style="color:#f87171">\</span> &nbsp;|&nbsp; 클릭 3회 → 제거<br>
    <b>중요</b> : 자기 손님 칸에 도착하면 울타리가 있어도 <b>무조건 멈춤</b>
  </div>

  <div class="info">
    <div class="badge">라운드 <b id="round">1</b></div>
    <div class="badge">울타리 <b id="fcnt">0</b>개</div>
    <div class="badge">목표 최소 <b id="min">?</b>개</div>
    <div class="badge">점수 <b id="score">0</b></div>
  </div>

  <div class="btns">
    <button class="s" onclick="clearAll()">울타리 초기화</button>
    <button class="p" onclick="simulate()">경로 시뮬레이션</button>
    <button class="g" onclick="check()">정답 확인</button>
    <button class="s" onclick="next()">다음 문제 →</button>
  </div>

  <canvas id="cv" width="560" height="560"></canvas>

  <div class="legend">
    <span>🚗 + 화살표 = 차량 방향</span>
    <span>👤 = 손님</span>
    <span style="color:#f87171">빨간 대각선 = 울타리</span>
    <span style="color:#fbbf24">노란 선 = 지나간 경로</span>
  </div>

  <div class="fb" id="fb"></div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const N = 7;
const S = 80;

let lvIdx = 0;
let score = 0;
let fences = {};
let paths = [];

const levels = [
  {
    min: 2,
    cars: [
      { r: 1, c: 0, d: 'right', id: 1, col: '#3b82f6' },
      { r: 5, c: 0, d: 'right', id: 2, col: '#22c55e' }
    ],
    guests: [
      { r: 0, c: 4, id: 1 },
      { r: 6, c: 4, id: 2 }
    ]
  },
  {
    min: 3,
    cars: [
      { r: 0, c: 1, d: 'down', id: 1, col: '#3b82f6' },
      { r: 0, c: 3, d: 'down', id: 2, col: '#eab308' },
      { r: 0, c: 5, d: 'down', id: 3, col: '#22c55e' }
    ],
    guests: [
      { r: 6, c: 0, id: 1 },
      { r: 6, c: 3, id: 2 },
      { r: 6, c: 6, id: 3 }
    ]
  },
  {
    min: 3,
    cars: [
      { r: 2, c: 0, d: 'right', id: 1, col: '#3b82f6' },
      { r: 4, c: 0, d: 'right', id: 2, col: '#22c55e' },
      { r: 0, c: 3, d: 'down', id: 3, col: '#eab308' }
    ],
    guests: [
      { r: 1, c: 6, id: 1 },
      { r: 5, c: 6, id: 2 },
      { r: 6, c: 3, id: 3 }
    ]
  },
  {
    min: 4,
    cars: [
      { r: 0, c: 0, d: 'right', id: 1, col: '#3b82f6' },
      { r: 0, c: 6, d: 'left',  id: 2, col: '#22c55e' },
      { r: 6, c: 0, d: 'right', id: 3, col: '#eab308' },
      { r: 6, c: 6, d: 'left',  id: 4, col: '#f97316' }
    ],
    guests: [
      { r: 3, c: 2, id: 1 },
      { r: 3, c: 4, id: 2 },
      { r: 2, c: 3, id: 3 },
      { r: 4, c: 3, id: 4 }
    ]
  }
];

const delta = {
  up:    { dr: -1, dc: 0 },
  down:  { dr:  1, dc: 0 },
  left:  { dr:  0, dc: -1 },
  right: { dr:  0, dc:  1 }
};

function reflect(dir, fenceType) {
  if (fenceType === 1) { // /
    if (dir === 'right') return 'up';
    if (dir === 'left')  return 'down';
    if (dir === 'down')  return 'left';
    if (dir === 'up')    return 'right';
  } else { // \
    if (dir === 'right') return 'down';
    if (dir === 'left')  return 'up';
    if (dir === 'down')  return 'right';
    if (dir === 'up')    return 'left';
  }
  return dir;
}

function lv() { return levels[lvIdx % levels.length]; }

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const L = lv();

  // 그리드
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath();
    ctx.moveTo(i * S, 0);
    ctx.lineTo(i * S, N * S);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * S);
    ctx.lineTo(N * S, i * S);
    ctx.stroke();
  }

  // 울타리
  for (const k in fences) {
    const [r, c] = k.split(',').map(Number);
    const x = c * S, y = r * S;
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (fences[k] === 1) {
      ctx.moveTo(x + 10, y + S - 10);
      ctx.lineTo(x + S - 10, y + 10);
    } else {
      ctx.moveTo(x + 10, y + 10);
      ctx.lineTo(x + S - 10, y + S - 10);
    }
    ctx.stroke();
  }

  // 경로
  paths.forEach(p => {
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x1, p.y1);
    ctx.lineTo(p.x2, p.y2);
    ctx.stroke();
  });

  // 손님
  L.guests.forEach(g => {
    ctx.font = '30px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👤', g.c * S + S/2, g.r * S + S/2);
  });

  // 차량
  L.cars.forEach(car => {
    const x = car.c * S + S/2;
    const y = car.r * S + S/2;
    ctx.beginPath();
    ctx.fillStyle = car.col;
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const arrow = { up:'↑', down:'↓', left:'←', right:'→' }[car.d];
    ctx.fillText(arrow, x, y);
  });
}

function cellAt(x, y) {
  const c = Math.floor(x / S);
  const r = Math.floor(y / S);
  if (r < 0 || c < 0 || r >= N || c >= N) return null;
  return { r, c };
}

cv.onclick = e => {
  const rect = cv.getBoundingClientRect();
  const cell = cellAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!cell) return;

  const L = lv();
  if (L.cars.some(c => c.r === cell.r && c.c === cell.c)) return;
  if (L.guests.some(g => g.r === cell.r && g.c === cell.c)) return;

  const key = `${cell.r},${cell.c}`;
  const cur = fences[key] || 0;
  if (cur === 0) fences[key] = 1;
  else if (cur === 1) fences[key] = 2;
  else delete fences[key];

  document.getElementById('fcnt').textContent = Object.keys(fences).length;
  paths = [];
  draw();
  hideFb();
};

function clearAll() {
  fences = {};
  paths = [];
  document.getElementById('fcnt').textContent = 0;
  draw();
  hideFb();
}

function out(r, c) {
  return r < 0 || c < 0 || r >= N || c >= N;
}

// ★★★ 핵심 수정: 도착 체크를 최우선으로 ★★★
function simOne(car) {
  let r = car.r, c = car.c, dir = car.d;
  const trail = [{ r, c }];
  let ok = false;
  const max = N * N + 10;
  const target = lv().guests.find(g => g.id === car.id);

  for (let i = 0; i < max; i++) {
    // 1. 현재 위치가 이미 자기 손님이면 성공
    if (r === target.r && c === target.c) {
      ok = true;
      break;
    }

    // 2. 다음 칸 계산
    let nr = r + delta[dir].dr;
    let nc = c + delta[dir].dc;

    // 3. 맵 밖이면 실패
    if (out(nr, nc)) {
      trail.push({ r: nr, c: nc, out: true });
      break;
    }

    // 4. 이동
    r = nr;
    c = nc;
    trail.push({ r, c });

    // 5. ★ 이동 직후 가장 먼저 도착 체크 (울타리보다 우선)
    if (r === target.r && c === target.c) {
      ok = true;
      break;   // 울타리가 있어도 여기서 끝!
    }

    // 6. 자기 손님이 아닐 때만 울타리 반사 적용
    const f = fences[`${r},${c}`];
    if (f) {
      dir = reflect(dir, f);
    }
  }
  return { ok, trail };
}

function simulate() {
  paths = [];
  const L = lv();
  let allOk = true;
  const fail = [];

  L.cars.forEach(car => {
    const res = simOne(car);
    if (!res.ok) {
      allOk = false;
      fail.push(car.id);
    }

    // 경로 그리기 (out인 선은 제외)
    for (let i = 0; i < res.trail.length - 1; i++) {
      const a = res.trail[i];
      const b = res.trail[i + 1];
      if (b.out) break;
      paths.push({
        x1: a.c * S + S/2,
        y1: a.r * S + S/2,
        x2: b.c * S + S/2,
        y2: b.r * S + S/2
      });
    }
  });

  draw();

  const fb = document.getElementById('fb');
  fb.classList.add('show');
  if (allOk) {
    fb.className = 'fb show ok';
    fb.innerHTML = `✅ 모든 차량이 자기 손님에게 도착했습니다!<br>사용 울타리 <b>${Object.keys(fences).length}</b>개 (목표 ${L.min}개)`;
  } else {
    fb.className = 'fb show no';
    fb.innerHTML = `❌ 실패 차량: ${fail.join(', ')}번<br>맵 밖으로 나갔거나 경로가 잘못되었습니다.`;
  }
  return allOk;
}

function check() {
  const ok = simulate();
  const used = Object.keys(fences).length;
  const L = lv();
  const fb = document.getElementById('fb');
  if (ok) {
    if (used <= L.min + 1) {
      score++;
      document.getElementById('score').textContent = score;
      fb.innerHTML += `<br><br>🎉 좋은 배치입니다! (+1점)`;
    } else {
      fb.innerHTML += `<br><br>도착은 했지만 울타리가 많습니다. 더 줄여보세요.`;
    }
  }
}

function next() {
  lvIdx++;
  if (lvIdx >= levels.length) {
    alert(`연습 종료\n점수: ${score} / ${levels.length}`);
    lvIdx = 0;
    score = 0;
  }
  fences = {};
  paths = [];
  document.getElementById('round').textContent = lvIdx + 1;
  document.getElementById('min').textContent = lv().min;
  document.getElementById('fcnt').textContent = 0;
  document.getElementById('score').textContent = score;
  hideFb();
  draw();
}

function hideFb() {
  document.getElementById('fb').className = 'fb';
}

// 시작
document.getElementById('min').textContent = lv().min;
draw();
</script>
</body>
</html>
