<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길 만들기 - 가장자리 배치 + 고난이도</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    max-width: 920px;
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #334155;
  }
  h1 { text-align: center; font-size: 1.4rem; margin-bottom: 2px; }
  .sub { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; }

  .info {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .badge {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .badge b { color: #fbbf24; }

  .btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
  }
  .p { background: #3b82f6; color: #fff; }
  .s { background: #334155; color: #e2e8f0; }
  .g { background: #16a34a; color: #fff; }

  #cv {
    display: block;
    margin: 0 auto;
    background: #0f172a;
    border: 3px solid #475569;
    border-radius: 8px;
    cursor: crosshair;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 10px;
  }

  .fb {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #0f172a;
    border-left: 4px solid #64748b;
    display: none;
    line-height: 1.5;
    font-size: 0.9rem;
  }
  .fb.show { display: block; }
  .fb.ok { border-left-color: #22c55e; }
  .fb.no { border-left-color: #ef4444; }

  .tip {
    background: rgba(59,130,246,0.12);
    border-left: 4px solid #3b82f6;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 0.84rem;
    margin-bottom: 12px;
    line-height: 1.55;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>길 만들기 게임</h1>
  <p class="sub">가장자리 배치 · 격자 투명 처리 · 고난이도 레벨 포함</p>

  <div class="tip">
    <b>울타리</b> : 클릭 1회 → <span style="color:#f87171">/</span> &nbsp;|&nbsp; 클릭 2회 → <span style="color:#f87171">\</span> &nbsp;|&nbsp; 클릭 3회 → 제거<br>
    <b>배치</b> : 차량·손님은 가장자리에 있으며, 격자선이 없어 밖에 있는 것처럼 보입니다.<br>
    <b>목표</b> : 최소 울타리로 모든 같은 번호 차량→손님을 연결하세요.
  </div>

  <div class="info">
    <div class="badge">라운드 <b id="round">1</b></div>
    <div class="badge">울타리 <b id="fcnt">0</b>개</div>
    <div class="badge">목표 최소 <b id="min">?</b>개</div>
    <div class="badge">점수 <b id="score">0</b></div>
  </div>

  <div class="btns">
    <button class="s" onclick="clearAll()">울타리 초기화</button>
    <button class="p" onclick="simulate()">경로 시뮬레이션</button>
    <button class="g" onclick="check()">정답 확인</button>
    <button class="s" onclick="next()">다음 문제 →</button>
  </div>

  <canvas id="cv" width="640" height="640"></canvas>

  <div class="legend">
    <span>원형+숫자 = 차량</span>
    <span>사각+숫자 = 손님</span>
    <span style="color:#f87171">빨간 대각선 = 울타리</span>
    <span style="color:#fbbf24">노란 선 = 경로</span>
  </div>

  <div class="fb" id="fb"></div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const N = 8;          // 전체 칸 수 (가장자리 포함)
const S = 80;         // 셀 크기

let lvIdx = 0;
let score = 0;
let fences = {};
let paths = [];

// ========== 레벨 (차량·손님은 모두 가장자리) ==========
const levels = [
  // 1. 쉬움
  {
    min: 2,
    cars: [
      { r: 0, c: 2, d: 'down', id: 1, col: '#3b82f6' },
      { r: 0, c: 5, d: 'down', id: 2, col: '#22c55e' }
    ],
    guests: [
      { r: 7, c: 1, id: 1, col: '#3b82f6' },
      { r: 7, c: 6, id: 2, col: '#22c55e' }
    ]
  },
  // 2. 보통
  {
    min: 3,
    cars: [
      { r: 0, c: 1, d: 'down', id: 1, col: '#3b82f6' },
      { r: 0, c: 4, d: 'down', id: 2, col: '#eab308' },
      { r: 0, c: 6, d: 'down', id: 3, col: '#22c55e' }
    ],
    guests: [
      { r: 7, c: 0, id: 1, col: '#3b82f6' },
      { r: 7, c: 3, id: 2, col: '#eab308' },
      { r: 7, c: 7, id: 3, col: '#22c55e' }
    ]
  },
  // 3. 어려움
  {
    min: 4,
    cars: [
      { r: 1, c: 0, d: 'right', id: 1, col: '#3b82f6' },
      { r: 3, c: 0, d: 'right', id: 2, col: '#22c55e' },
      { r: 5, c: 0, d: 'right', id: 3, col: '#eab308' },
      { r: 0, c: 3, d: 'down',  id: 4, col: '#f97316' }
    ],
    guests: [
      { r: 2, c: 7, id: 1, col: '#3b82f6' },
      { r: 4, c: 7, id: 2, col: '#22c55e' },
      { r: 6, c: 7, id: 3, col: '#eab308' },
      { r: 7, c: 3, id: 4, col: '#f97316' }
    ]
  },
  // 4. 아주 어려움 (울타리 공유 필수)
  {
    min: 4,
    cars: [
      { r: 0, c: 0, d: 'right', id: 1, col: '#3b82f6' },
      { r: 0, c: 7, d: 'left',  id: 2, col: '#22c55e' },
      { r: 7, c: 0, d: 'right', id: 3, col: '#eab308' },
      { r: 7, c: 7, d: 'left',  id: 4, col: '#f97316' }
    ],
    guests: [
      { r: 3, c: 3, id: 1, col: '#3b82f6' },
      { r: 3, c: 4, id: 2, col: '#22c55e' },
      { r: 4, c: 3, id: 3, col: '#eab308' },
      { r: 4, c: 4, id: 4, col: '#f97316' }
    ]
  },
  // 5. 극한
  {
    min: 5,
    cars: [
      { r: 0, c: 1, d: 'down', id: 1, col: '#3b82f6' },
      { r: 0, c: 3, d: 'down', id: 2, col: '#22c55e' },
      { r: 0, c: 5, d: 'down', id: 3, col: '#eab308' },
      { r: 1, c: 0, d: 'right',id: 4, col: '#f97316' },
      { r: 1, c: 7, d: 'left', id: 5, col: '#a855f7' }
    ],
    guests: [
      { r: 7, c: 2, id: 1, col: '#3b82f6' },
      { r: 7, c: 4, id: 2, col: '#22c55e' },
      { r: 7, c: 6, id: 3, col: '#eab308' },
      { r: 6, c: 0, id: 4, col: '#f97316' },
      { r: 6, c: 7, id: 5, col: '#a855f7' }
    ]
  }
];

const delta = {
  up:    { dr: -1, dc: 0 },
  down:  { dr:  1, dc: 0 },
  left:  { dr:  0, dc: -1 },
  right: { dr:  0, dc:  1 }
};

function reflect(dir, type) {
  if (type === 1) { // /
    if (dir === 'right') return 'up';
    if (dir === 'left')  return 'down';
    if (dir === 'down')  return 'left';
    if (dir === 'up')    return 'right';
  } else { // \
    if (dir === 'right') return 'down';
    if (dir === 'left')  return 'up';
    if (dir === 'down')  return 'right';
    if (dir === 'up')    return 'left';
  }
  return dir;
}

function lv() { return levels[lvIdx % levels.length]; }

function isBorder(r, c) {
  return r === 0 || c === 0 || r === N-1 || c === N-1;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const L = lv();

  // 격자선 : 가장자리는 그리지 않음 (투명 처리)
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    // 세로선
    ctx.beginPath();
    ctx.moveTo(i * S, S);               // 위쪽 가장자리 제외
    ctx.lineTo(i * S, (N-1) * S);       // 아래쪽 가장자리 제외
    ctx.stroke();
    // 가로선
    ctx.beginPath();
    ctx.moveTo(S, i * S);
    ctx.lineTo((N-1) * S, i * S);
    ctx.stroke();
  }

  // 울타리 (가장자리에는 설치 불가이므로 안쪽에만)
  for (const k in fences) {
    const [r, c] = k.split(',').map(Number);
    if (isBorder(r, c)) continue;
    const x = c * S, y = r * S;
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (fences[k] === 1) {
      ctx.moveTo(x + 10, y + S - 10);
      ctx.lineTo(x + S - 10, y + 10);
    } else {
      ctx.moveTo(x + 10, y + 10);
      ctx.lineTo(x + S - 10, y + S - 10);
    }
    ctx.stroke();
  }

  // 경로
  paths.forEach(p => {
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x1, p.y1);
    ctx.lineTo(p.x2, p.y2);
    ctx.stroke();
  });

  // 손님 (가장자리)
  L.guests.forEach(g => {
    const x = g.c * S + S/2;
    const y = g.r * S + S/2;
    ctx.fillStyle = g.col;
    ctx.fillRect(x - 18, y - 18, 36, 36);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(g.id, x, y);
  });

  // 차량 (가장자리)
  L.cars.forEach(car => {
    const x = car.c * S + S/2;
    const y = car.r * S + S/2;
    ctx.beginPath();
    ctx.fillStyle = car.col;
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(car.id, x, y - 6);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 14px sans-serif';
    const arrow = { up:'↑', down:'↓', left:'←', right:'→' }[car.d];
    ctx.fillText(arrow, x, y + 10);
  });
}

function cellAt(x, y) {
  const c = Math.floor(x / S);
  const r = Math.floor(y / S);
  if (r < 0 || c < 0 || r >= N || c >= N) return null;
  return { r, c };
}

cv.onclick = e => {
  const rect = cv.getBoundingClientRect();
  const cell = cellAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!cell) return;

  // 가장자리에는 울타리 설치 불가
  if (isBorder(cell.r, cell.c)) return;

  const L = lv();
  if (L.cars.some(c => c.r === cell.r && c.c === cell.c)) return;
  if (L.guests.some(g => g.r === cell.r && g.c === cell.c)) return;

  const key = `${cell.r},${cell.c}`;
  const cur = fences[key] || 0;
  if (cur === 0) fences[key] = 1;
  else if (cur === 1) fences[key] = 2;
  else delete fences[key];

  document.getElementById('fcnt').textContent = Object.keys(fences).length;
  paths = [];
  draw();
  hideFb();
};

function clearAll() {
  fences = {};
  paths = [];
  document.getElementById('fcnt').textContent = 0;
  draw();
  hideFb();
}

function out(r, c) {
  return r < 0 || c < 0 || r >= N || c >= N;
}

function simOne(car) {
  let r = car.r, c = car.c, dir = car.d;
  const trail = [{ r, c }];
  let ok = false;
  const max = N * N + 12;
  const target = lv().guests.find(g => g.id === car.id);

  for (let i = 0; i < max; i++) {
    if (r === target.r && c === target.c) {
      ok = true;
      break;
    }

    let nr = r + delta[dir].dr;
    let nc = c + delta[dir].dc;

    if (out(nr, nc)) {
      trail.push({ r: nr, c: nc, out: true });
      break;
    }

    r = nr;
    c = nc;
    trail.push({ r, c });

    if (r === target.r && c === target.c) {
      ok = true;
      break;
    }

    const f = fences[`${r},${c}`];
    if (f) dir = reflect(dir, f);
  }
  return { ok, trail };
}

function simulate() {
  paths = [];
  const L = lv();
  let allOk = true;
  const fail = [];

  L.cars.forEach(car => {
    const res = simOne(car);
    if (!res.ok) {
      allOk = false;
      fail.push(car.id);
    }
    for (let i = 0; i < res.trail.length - 1; i++) {
      const a = res.trail[i];
      const b = res.trail[i + 1];
      if (b.out) break;
      paths.push({
        x1: a.c * S + S/2,
        y1: a.r * S + S/2,
        x2: b.c * S + S/2,
        y2: b.r * S + S/2
      });
    }
  });

  draw();

  const fb = document.getElementById('fb');
  fb.classList.add('show');
  if (allOk) {
    fb.className = 'fb show ok';
    fb.innerHTML = `✅ 모든 차량 도착!<br>사용 울타리 <b>${Object.keys(fences).length}</b>개 (목표 ${L.min}개)`;
  } else {
    fb.className = 'fb show no';
    fb.innerHTML = `❌ 실패 차량: ${fail.join(', ')}번<br>맵 밖으로 나갔거나 경로가 잘못되었습니다.`;
  }
  return allOk;
}

function check() {
  const ok = simulate();
  const used = Object.keys(fences).length;
  const L = lv();
  const fb = document.getElementById('fb');
  if (ok) {
    if (used <= L.min + 1) {
      score++;
      document.getElementById('score').textContent = score;
      fb.innerHTML += `<br><br>🎉 좋은 배치! (+1점)`;
    } else {
      fb.innerHTML += `<br><br>도착은 했지만 울타리가 많습니다.`;
    }
  }
}

function next() {
  lvIdx++;
  if (lvIdx >= levels.length) {
    alert(`연습 종료\n점수: ${score} / ${levels.length}`);
    lvIdx = 0;
    score = 0;
  }
  fences = {};
  paths = [];
  document.getElementById('round').textContent = lvIdx + 1;
  document.getElementById('min').textContent = lv().min;
  document.getElementById('fcnt').textContent = 0;
  document.getElementById('score').textContent = score;
  hideFb();
  draw();
}

function hideFb() {
  document.getElementById('fb').className = 'fb';
}

// 시작
document.getElementById('min').textContent = lv().min;
draw();
</script>
</body>
</html>
