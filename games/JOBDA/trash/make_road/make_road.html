<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JOBDA 7x7 정량적 난이도 평가 수학 엔진</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #eee; padding: 20px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 4px; }
        .sub { color: #9ca3af; font-size: 14px; margin-bottom: 16px; }

        .status-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .badge { background: #1f2937; border: 1px solid #374151; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge b { color: #fbbf24; }
        .badge.stage-badge { border-color: #8b5cf6; background: #2e1065; }
        .badge.stage-badge b { color: #a78bfa; }
        .badge.score-badge { border-color: #f59e0b; background: #451a03; }
        .badge.score-badge b { color: #fde047; }

        .engine-container { position: relative; width: 432px; height: 432px; margin: 0 auto 16px auto; }
        .board { display: grid; grid-template-columns: repeat(7, 60px); grid-template-rows: repeat(7, 60px); gap: 2px; position: absolute; top: 0; left: 0; z-index: 1; }
        .cell { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; border-radius: 4px; box-sizing: border-box; overflow: hidden; }
        
        .corner { background: transparent; }
        .edge { background: #1f2937; color: #fff; font-size: 18px; border: 1px dashed #4b5563; }
        .core { background: #374151; cursor: pointer; border: 1px solid #4b5563; user-select: none; transition: 0.2s; position: relative; }
        .core:hover { background: #4b5563; }
        
        #pathCanvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        
        .controls { margin-top: 10px; }
        button { padding: 10px 18px; background: #2563eb; color: white; border: none; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 6px; margin: 0 3px; }
        button:hover { background: #1d4ed8; }
        .btn-reset { background: #4b5563; }
        .btn-gen { background: #8b5cf6; }
        .btn-gen:hover { background: #7c3aed; }
        
        #log { margin: 16px auto; width: 620px; background: #000; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; height: 200px; overflow-y: auto; color: #a3e635; text-align: left; font-size: 13px; border: 1px solid #333; }
        .error { color: #f87171; }
        .highlight { color: #fbbf24; }
        .stage-up { color: #c084fc; font-weight: bold; }
        .metric-info { color: #38bdf8; }
    </style>
</head>
<body>

    <h2>🚗 JOBDA 수학적 난이도 산출 커리어 엔진</h2>
    <div class="sub">5대 정량 지표(K, S, B, D, T)기반 실시간 점수 계산 알고리즘 탑재</div>

    <div class="status-bar">
        <div class="badge stage-badge">단계: <b id="stageText">Stage 1</b></div>
        <div class="badge score-badge">난이도 점수: <b id="diffScoreText">0점</b></div>
        <div class="badge">차량: <b id="carCountText">3대</b></div>
        <div class="badge">목표 거울(K): <b id="minCount">0개</b></div>
        <div class="badge">거울 공유(S): <b id="sharedCount">0개</b></div>
        <div class="badge">설치 거울: <b id="usedCount">0개</b></div>
    </div>

    <div class="engine-container">
        <div class="board" id="board"></div>
        <canvas id="pathCanvas" width="432" height="432"></canvas>
    </div>
    
    <div class="controls">
        <button class="btn-reset" onclick="resetBoard()">거울 초기화</button>
        <button onclick="runSimulation()">▶ 경로 검증 및 채점</button>
        <button class="btn-gen" onclick="nextStageLevel()">🎲 다음 난이도 문제 생성</button>
    </div>
    
    <div id="log">수학적 난이도 분석 엔진 가동 준비 완료.</div>

<script>
    const N = 7;
    const CELL_SIZE = 60;
    const GAP = 2;
    
    let grid = Array(N).fill(0).map(() => Array(N).fill(0));
    
    // 📈 정량 난이도 점수(Score) 기반 스테이지 구분
    const STAGES = [
        { stage: 1, cars: 3, minScore: 10, maxScore: 18, title: "3인 기초 입문" },
        { stage: 2, cars: 3, minScore: 19, maxScore: 27, title: "3인 교차 및 우회 응용" },
        { stage: 3, cars: 3, minScore: 28, maxScore: 37, title: "3인 거울 공유(S>=1) 직관 파괴" },
        { stage: 4, cars: 3, minScore: 38, maxScore: 99, title: "🔥 3인 한계 극악 난이도" },
        { stage: 5, cars: 4, minScore: 25, maxScore: 35, title: "4인 확장 기본 네트워크" },
        { stage: 6, cars: 4, minScore: 36, maxScore: 48, title: "4인 다중 교차 병목" },
        { stage: 7, cars: 4, minScore: 49, maxScore: 62, title: "4인 다중 거울 공유(S>=2)" },
        { stage: 8, cars: 4, minScore: 63, maxScore: 999, title: "👑 4인 마스터 클래스 (유일해)" }
    ];

    let currentStageIdx = 0;
    let currentMissions = [];
    let currentAnalysis = null;

    const boardEl = document.getElementById('board');
    const canvas = document.getElementById('pathCanvas');
    const ctx = canvas.getContext('2d');

    function initBoard() {
        boardEl.innerHTML = '';
        for(let r = 0; r < N; r++) {
            for(let c = 0; c < N; c++) {
                const div = document.createElement('div');
                div.className = 'cell';
                
                if ((r===0 && c===0) || (r===0 && c===N-1) || (r===N-1 && c===0) || (r===N-1 && c===N-1)) {
                    div.classList.add('corner');
                } else if (r===0 || r===N-1 || c===0 || c===N-1) {
                    div.classList.add('edge');
                    div.id = `edge-${r}-${c}`;
                } else {
                    div.classList.add('core');
                    div.id = `core-${r}-${c}`;
                    div.onclick = () => {
                        grid[r][c] = (grid[r][c] + 1) % 3;
                        updateMirrorUI(r, c, div);
                        updateUsedCount();
                    };
                }
                boardEl.appendChild(div);
            }
        }
        generateStageLevel(0);
    }

    function updateMirrorUI(r, c, el) {
        if (grid[r][c] === 1) { // '/'
            el.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 60 60" style="display:block; pointer-events:none;">
                    <line x1="10" y1="50" x2="50" y2="10" stroke="#f87171" stroke-width="6" stroke-linecap="round" />
                    <line x1="10" y1="50" x2="50" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                </svg>`;
        } else if (grid[r][c] === 2) { // '\'
            el.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 60 60" style="display:block; pointer-events:none;">
                    <line x1="10" y1="10" x2="50" y2="50" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
                    <line x1="10" y1="10" x2="50" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                </svg>`;
        } else {
            el.innerHTML = '';
        }
    }

    // 🧠 5대 정량 지표 기반 수학적 난이도 평가 알고리즘
    function evaluateProblemMetrics(missions) {
        const coreCells = [];
        for (let r = 1; r <= 5; r++) {
            for (let c = 1; c <= 5; c++) coreCells.push({ r, c });
        }

        let simGrid = Array(N).fill(0).map(() => Array(N).fill(0));
        let bestSolution = null;

        function testSolution() {
            for (let m of missions) {
                let r = m.r, c = m.c, dir = m.dir;
                let step = 0;
                while (step < 50) {
                    step++;
                    if (r > 0 && r < 6 && c > 0 && c < 6) {
                        let mir = simGrid[r][c];
                        if (mir > 0) dir = reflect(dir, mir);
                    }
                    r += DIRS[dir].dr;
                    c += DIRS[dir].dc;
                    if (r < 0 || r >= N || c < 0 || c >= N) {
                        let finalR = r - DIRS[dir].dr;
                        let finalC = c - DIRS[dir].dc;
                        if (finalR !== m.targetR || finalC !== m.targetC) return false;
                        break;
                    }
                }
                if (step >= 50) return false;
            }
            return true;
        }

        function dfs(cellIdx, count, maxK) {
            if (count === maxK) {
                if (testSolution()) {
                    bestSolution = simGrid.map(row => [...row]);
                    return true;
                }
                return false;
            }
            if (cellIdx >= coreCells.length) return false;
            if (count + (coreCells.length - cellIdx) < maxK) return false;

            let { r, c } = coreCells[cellIdx];

            if (dfs(cellIdx + 1, count, maxK)) return true;

            simGrid[r][c] = 1;
            if (dfs(cellIdx + 1, count + 1, maxK)) return true;

            simGrid[r][c] = 2;
            if (dfs(cellIdx + 1, count + 1, maxK)) return true;

            simGrid[r][c] = 0;
            return false;
        }

        let minK = -1;
        for (let k = 1; k <= 8; k++) {
            if (dfs(0, 0, k)) { minK = k; break; }
        }

        if (minK === -1 || !bestSolution) return null;

        // 📊 정량적 세부 메트릭 측정
        let mirrorHitCounts = Array(N).fill(0).map(() => Array(N).fill(0));
        let totalBends = 0;
        let totalPathLength = 0;
        let totalManhattanDist = 0;

        for (let m of missions) {
            let r = m.r, c = m.c, dir = m.dir;
            totalManhattanDist += Math.abs(m.r - m.targetR) + Math.abs(m.c - m.targetC);
            let step = 0;
            
            while (step < 50) {
                step++;
                if (r > 0 && r < 6 && c > 0 && c < 6) {
                    let mir = bestSolution[r][c];
                    if (mir > 0) {
                        let prevDir = dir;
                        dir = reflect(dir, mir);
                        if (prevDir !== dir) {
                            totalBends++;
                            mirrorHitCounts[r][c]++;
                        }
                    }
                }
                r += DIRS[dir].dr;
                c += DIRS[dir].dc;
                totalPathLength++;
                if (r < 0 || r >= N || c < 0 || c >= N) break;
            }
        }

        // 1. 거울 공유 수 (S): 한 거울을 2회 이상 빛이 통과한 셀의 수
        let sharedMirrors = 0;
        for (let r = 1; r <= 5; r++) {
            for (let c = 1; c <= 5; c++) {
                if (bestSolution[r][c] > 0 && mirrorHitCounts[r][c] >= 2) {
                    sharedMirrors++;
                }
            }
        }

        // 2. 기하학적 기만도 (D): 우회율 비율
        let deception = totalPathLength / Math.max(1, totalManhattanDist);

        // 3. 함정 밀도 (T) 추정치
        let trapDensity = (minK * 0.8) + (sharedMirrors * 1.5) + (totalBends * 0.5);

        // 📐 [난이도 산출 공식 적용]
        // Difficulty Score = (3.0 * K) + (8.0 * S) + (1.5 * B) + (2.0 * D) + (1.2 * T)
        let score = (3.0 * minK) + (8.0 * sharedMirrors) + (1.5 * totalBends) + (2.0 * deception) + (1.2 * trapDensity);
        score = Math.round(score);

        return {
            minK,
            sharedMirrors,
            totalBends,
            deception: deception.toFixed(2),
            trapDensity: trapDensity.toFixed(1),
            score
        };
    }

    // 🎲 목표 난이도 점수를 만족하는 알고리즘 문제 정밀 생성
    function generateStageLevel(stageIdx) {
        currentStageIdx = stageIdx;
        const config = STAGES[currentStageIdx];

        document.getElementById('stageText').textContent = `Stage ${config.stage}`;
        document.getElementById('carCountText').textContent = `${config.cars}대`;
        document.getElementById('diffScoreText').textContent = "측정 중...";
        document.getElementById('minCount').textContent = "...";
        document.getElementById('sharedCount').textContent = "...";
        
        document.getElementById('log').innerHTML = `⚙️ [Stage ${config.stage}] 목표 난이도 점수 (${config.minScore}점 ~ ${config.maxScore}점)에 들어맞는 완벽한 정량 구조 계산 중...`;

        setTimeout(() => {
            let attempts = 0;
            let bestCandidate = null;

            const carPresets = [
                { id: "🔴", color: "#ef4444" },
                { id: "🔵", color: "#3b82f6" },
                { id: "🟡", color: "#f59e0b" },
                { id: "🟢", color: "#10b981" }
            ];

            const edgeSlots = [];
            for (let c = 1; c <= 5; c++) edgeSlots.push({ r: 0, c, dir: 'DOWN' });
            for (let c = 1; c <= 5; c++) edgeSlots.push({ r: 6, c, dir: 'UP' });
            for (let r = 1; r <= 5; r++) edgeSlots.push({ r, c: 0, dir: 'RIGHT' });
            for (let r = 1; r <= 5; r++) edgeSlots.push({ r, c: 6, dir: 'LEFT' });

            while (attempts < 1200) {
                attempts++;
                let shuffledSlots = [...edgeSlots].sort(() => Math.random() - 0.5);
                
                let candidateMissions = [];
                let validSetup = true;

                for (let i = 0; i < config.cars; i++) {
                    let start = shuffledSlots[i * 2];
                    let target = shuffledSlots[i * 2 + 1];

                    if ((start.dir === 'DOWN' && target.dir === 'UP' && start.c === target.c) ||
                        (start.dir === 'RIGHT' && target.dir === 'LEFT' && start.r === target.r)) {
                        validSetup = false;
                        break;
                    }

                    candidateMissions.push({
                        id: carPresets[i].id,
                        color: carPresets[i].color,
                        r: start.r, c: start.c, dir: start.dir,
                        targetR: target.r, targetC: target.c
                    });
                }

                if (!validSetup) continue;

                let analysis = evaluateProblemMetrics(candidateMissions);
                if (analysis) {
                    // 특정 Stage의 지표 조건 필터링 (예: Stage 3 이상은 S >= 1 필수)
                    if (config.stage === 3 && analysis.sharedMirrors < 1) continue;
                    if (config.stage === 7 && analysis.sharedMirrors < 2) continue;

                    if (analysis.score >= config.minScore && analysis.score <= config.maxScore) {
                        currentMissions = candidateMissions;
                        currentAnalysis = analysis;
                        break;
                    }

                    // 적합한 범위에 가장 가까운 후보 보관
                    if (!bestCandidate || Math.abs(analysis.score - config.minScore) < Math.abs(bestCandidate.analysis.score - config.minScore)) {
                        bestCandidate = { missions: candidateMissions, analysis };
                    }
                }
            }

            if (!currentMissions.length && bestCandidate) {
                currentMissions = bestCandidate.missions;
                currentAnalysis = bestCandidate.analysis;
            }

            renderLevelUI(config);
        }, 50);
    }

    function renderLevelUI(config) {
        document.getElementById('diffScoreText').textContent = `${currentAnalysis.score}점`;
        document.getElementById('minCount').textContent = `${currentAnalysis.minK}개`;
        document.getElementById('sharedCount').textContent = `${currentAnalysis.sharedMirrors}개`;
        resetBoard();

        document.querySelectorAll('.edge').forEach(el => el.innerHTML = '');
        currentMissions.forEach(m => {
            const startEl = document.getElementById(`edge-${m.r}-${m.c}`);
            if(startEl) startEl.innerHTML = m.id;
            const targetEl = document.getElementById(`edge-${m.targetR}-${m.targetC}`);
            if(targetEl) targetEl.innerHTML = `<span style="border-bottom: 3px solid ${m.color}">${m.id}</span>`;
        });

        document.getElementById('log').innerHTML = 
            `✨ <span class="stage-up">[Stage ${config.stage} 출제 완료]</span> - ${config.title}\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
            `📊 <span class="metric-info">정량적 난이도 종합 분석 결과:</span>\n` +
            `  • 최종 난이도 점수: <span class="highlight">${currentAnalysis.score}점</span>\n` +
            `  • [K] 최소 반사경 수 : ${currentAnalysis.minK}개\n` +
            `  • [S] 거울 공유 횟수 : ${currentAnalysis.sharedMirrors}개\n` +
            `  • [B] 총 꺾임(Bends)  : ${currentAnalysis.totalBends}회\n` +
            `  • [D] 기하 우회 비율  : ${currentAnalysis.deception}x\n` +
            `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
            `반사경을 배치하여 최소 거울 수(${currentAnalysis.minK}개)로 정답을 맞춰보세요!`;
    }

    function updateUsedCount() {
        let count = 0;
        for(let r=1; r<6; r++)
            for(let c=1; c<6; c++)
                if(grid[r][c] > 0) count++;
        document.getElementById('usedCount').textContent = count;
    }

    function resetBoard() {
        grid = Array(N).fill(0).map(() => Array(N).fill(0));
        document.querySelectorAll('.core').forEach(el => el.innerHTML = '');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateUsedCount();
    }

    function nextStageLevel() {
        let nextIdx = (currentStageIdx + 1) % STAGES.length;
        generateStageLevel(nextIdx);
    }

    function reflect(dir, mirror) {
        if (mirror === 1) { // '/'
            if (dir === 'RIGHT') return 'UP';
            if (dir === 'LEFT') return 'DOWN';
            if (dir === 'DOWN') return 'LEFT';
            if (dir === 'UP') return 'RIGHT';
        } else if (mirror === 2) { // '\'
            if (dir === 'RIGHT') return 'DOWN';
            if (dir === 'LEFT') return 'UP';
            if (dir === 'DOWN') return 'RIGHT';
            if (dir === 'UP') return 'LEFT';
        }
        return dir;
    }

    const DIRS = { 'RIGHT': {dr: 0, dc: 1}, 'LEFT': {dr: 0, dc: -1}, 'DOWN': {dr: 1, dc: 0}, 'UP': {dr: -1, dc: 0} };

    function getCenter(r, c) {
        return { x: c * (CELL_SIZE + GAP) + (CELL_SIZE / 2), y: r * (CELL_SIZE + GAP) + (CELL_SIZE / 2) };
    }

    function runSimulation() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let logText = "--- 경로 검증 및 채점 시작 ---\n";
        const log = (msg) => logText += msg + "\n";
        
        let allSuccess = true;
        let usedMirrors = parseInt(document.getElementById('usedCount').textContent);

        for (let m of currentMissions) {
            let r = m.r, c = m.c, dir = m.dir;
            let history = new Set();
            let step = 0;
            
            ctx.beginPath();
            let startPos = getCenter(r, c);
            ctx.moveTo(startPos.x, startPos.y);
            ctx.strokeStyle = m.color;
            ctx.lineWidth = 4;

            while(step < 100) {
                step++;
                let state = `${r},${c},${dir}`;
                if (history.has(state)) {
                    log(`<span class="error">❌ [${m.id}] 무한 루프 발생!</span>`);
                    allSuccess = false;
                    break;
                }
                history.add(state);

                if (r > 0 && r < 6 && c > 0 && c < 6) {
                    let mirror = grid[r][c];
                    if (mirror > 0) dir = reflect(dir, mirror);
                }

                r += DIRS[dir].dr;
                c += DIRS[dir].dc;
                
                let nextPos = getCenter(r, c);
                ctx.lineTo(nextPos.x, nextPos.y);

                if (r < 0 || r >= N || c < 0 || c >= N) {
                    let finalR = r - DIRS[dir].dr;
                    let finalC = c - DIRS[dir].dc;
                    
                    if (finalR === m.targetR && finalC === m.targetC) {
                        log(`✅ [${m.id}] 목적지 도착 완료`);
                    } else {
                        log(`<span class="error">❌ [${m.id}] 경로 이탈</span>`);
                        allSuccess = false;
                    }
                    break;
                }
            }
            ctx.stroke();
        }

        log("\n--- 채점 결과 ---");
        if (!allSuccess) {
            log(`<span class="error">⚠️ 모든 차량이 목적지에 도달하지 못했습니다.</span>`);
        } else {
            if (usedMirrors === currentAnalysis.minK) {
                log(`🎉 <span class="highlight">PERFECT! Stage ${STAGES[currentStageIdx].stage} (난이도 점수 ${currentAnalysis.score}점) 클리어!</span>`);
                log(`AI 최적해 수인 반사경 ${currentAnalysis.minK}개로 정확히 풀어내셨습니다.`);
            } else if (usedMirrors > currentAnalysis.minK) {
                log(`✅ <span class="highlight">목적지 도착 성공!</span>`);
                log(`⚠️ 반사경을 더 절약해 보세요! (사용: ${usedMirrors}개 / 목표: ${currentAnalysis.minK}개)`);
            } else {
                log(`🎉 <span class="highlight">신기록 경신!</span>`);
            }
        }

        document.getElementById('log').innerHTML = logText;
    }

    initBoard();
</script>
</body>
</html>
