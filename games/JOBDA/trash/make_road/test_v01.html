<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JOBDA 7x7 무한 문제 생성 & 최적화 엔진</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #121212; color: #eee; padding: 20px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 4px; }
        .sub { color: #9ca3af; font-size: 14px; margin-bottom: 16px; }

        .status-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 16px; }
        .badge { background: #1f2937; border: 1px solid #374151; padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: bold; }
        .badge b { color: #fbbf24; }

        .engine-container { position: relative; width: 432px; height: 432px; margin: 0 auto 16px auto; }
        .board { display: grid; grid-template-columns: repeat(7, 60px); grid-template-rows: repeat(7, 60px); gap: 2px; position: absolute; top: 0; left: 0; z-index: 1; }
        .cell { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; border-radius: 4px; box-sizing: border-box; overflow: hidden; }
        
        .corner { background: transparent; }
        .edge { background: #1f2937; color: #fff; font-size: 18px; border: 1px dashed #4b5563; }
        .core { background: #374151; cursor: pointer; border: 1px solid #4b5563; user-select: none; transition: 0.2s; position: relative; }
        .core:hover { background: #4b5563; }
        
        #pathCanvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        
        .controls { margin-top: 10px; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; cursor: pointer; font-size: 15px; font-weight: bold; border-radius: 6px; margin: 0 4px; }
        button:hover { background: #1d4ed8; }
        .btn-reset { background: #4b5563; }
        .btn-gen { background: #8b5cf6; }
        .btn-gen:hover { background: #7c3aed; }
        
        #log { margin: 16px auto; width: 580px; background: #000; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; height: 180px; overflow-y: auto; color: #a3e635; text-align: left; font-size: 13px; border: 1px solid #333; }
        .error { color: #f87171; }
        .highlight { color: #fbbf24; }
    </style>
</head>
<body>

    <h2>🚗 JOBDA 무한 자동 생성 알고리즘 엔진</h2>
    <div class="sub">실시간 백트래킹 탐색기가 푸는 순간 해법을 계산해 냅니다.</div>

    <div class="status-bar">
        <div class="badge">문제 번호: <b id="lvlNum">1</b></div>
        <div class="badge">설치된 반사경: <b id="usedCount">0</b>개</div>
        <div class="badge">목표 최소 반사경: <b id="minCount">생성 중...</b>개</div>
    </div>

    <div class="engine-container">
        <div class="board" id="board"></div>
        <canvas id="pathCanvas" width="432" height="432"></canvas>
    </div>
    
    <div class="controls">
        <button class="btn-reset" onclick="resetBoard()">거울 초기화</button>
        <button onclick="runSimulation()">▶ 경로 검증 및 채점</button>
        <button class="btn-gen" onclick="generateNewLevel()">🎲 무한 문제 생성</button>
    </div>
    
    <div id="log">알고리즘 엔진 가동 중...</div>

<script>
    const N = 7;
    const CELL_SIZE = 60;
    const GAP = 2;
    
    let grid = Array(N).fill(0).map(() => Array(N).fill(0));
    let currentLevelNumber = 1;
    let targetMinMirrors = 0;
    let currentMissions = [];

    const boardEl = document.getElementById('board');
    const canvas = document.getElementById('pathCanvas');
    const ctx = canvas.getContext('2d');

    // 1. 보드 초기화
    function initBoard() {
        boardEl.innerHTML = '';
        for(let r = 0; r < N; r++) {
            for(let c = 0; c < N; c++) {
                const div = document.createElement('div');
                div.className = 'cell';
                
                if ((r===0 && c===0) || (r===0 && c===N-1) || (r===N-1 && c===0) || (r===N-1 && c===N-1)) {
                    div.classList.add('corner');
                } else if (r===0 || r===N-1 || c===0 || c===N-1) {
                    div.classList.add('edge');
                    div.id = `edge-${r}-${c}`;
                } else {
                    div.classList.add('core');
                    div.id = `core-${r}-${c}`;
                    div.onclick = () => {
                        grid[r][c] = (grid[r][c] + 1) % 3;
                        updateMirrorUI(r, c, div);
                        updateUsedCount();
                    };
                }
                boardEl.appendChild(div);
            }
        }
        generateNewLevel();
    }

    // SVG 벡터 대각선 반사경 렌더링
    function updateMirrorUI(r, c, el) {
        if (grid[r][c] === 1) { // '/' 형태 (좌하 -> 우상)
            el.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 60 60" style="display:block; pointer-events:none;">
                    <line x1="10" y1="50" x2="50" y2="10" stroke="#f87171" stroke-width="6" stroke-linecap="round" />
                    <line x1="10" y1="50" x2="50" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                </svg>`;
        } else if (grid[r][c] === 2) { // '\' 형태 (좌상 -> 우하)
            el.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 60 60" style="display:block; pointer-events:none;">
                    <line x1="10" y1="10" x2="50" y2="50" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
                    <line x1="10" y1="10" x2="50" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                </svg>`;
        } else {
            el.innerHTML = '';
        }
    }

    // 🎲 무한 문제 생성기 (실시간 백트래킹 검증)
    function generateNewLevel() {
        document.getElementById('minCount').textContent = "계산 중...";
        document.getElementById('log').innerHTML = `⚙️ 난이도 높은 풀 수 있는 절묘한 문제를 생성 중입니다...`;
        
        setTimeout(() => {
            let attempts = 0;
            const carPresets = [
                { id: "🔴", color: "#ef4444" },
                { id: "🔵", color: "#3b82f6" },
                { id: "🟡", color: "#f59e0b" },
                { id: "🟢", color: "#10b981" }
            ];

            // 사용 가능한 20개 테두리 슬롯 목록
            const edgeSlots = [];
            for (let c = 1; c <= 5; c++) edgeSlots.push({ r: 0, c, dir: 'DOWN' });
            for (let c = 1; c <= 5; c++) edgeSlots.push({ r: 6, c, dir: 'UP' });
            for (let r = 1; r <= 5; r++) edgeSlots.push({ r, c: 0, dir: 'RIGHT' });
            for (let r = 1; r <= 5; r++) edgeSlots.push({ r, c: 6, dir: 'LEFT' });

            while (attempts < 500) {
                attempts++;
                // 3개 또는 4개의 차량 무작위 선택
                let numCars = Math.floor(Math.random() * 2) + 3; // 3~4개
                let shuffledSlots = [...edgeSlots].sort(() => Math.random() - 0.5);
                
                let candidateMissions = [];
                let usedEndpoints = new Set();
                let validSetup = true;

                for (let i = 0; i < numCars; i++) {
                    let start = shuffledSlots[i * 2];
                    let target = shuffledSlots[i * 2 + 1];

                    // 직진만으로 바로 도달하는 지루한 직선 배치는 배제
                    if ((start.dir === 'DOWN' && target.dir === 'UP' && start.c === target.c) ||
                        (start.dir === 'RIGHT' && target.dir === 'LEFT' && start.r === target.r)) {
                        validSetup = false;
                        break;
                    }

                    candidateMissions.push({
                        id: carPresets[i].id,
                        color: carPresets[i].color,
                        r: start.r, c: start.c, dir: start.dir,
                        targetR: target.r, targetC: target.c
                    });
                }

                if (!validSetup) continue;

                // 최소 필요 반사경 탐색 (2개 이상 6개 이하인 적절한 고난도 문제만 채택)
                let minM = calculateAbsoluteMinMirrors(candidateMissions);
                if (minM >= 2 && minM <= 6) {
                    currentMissions = candidateMissions;
                    targetMinMirrors = minM;
                    break;
                }
            }

            renderLevelUI();
        }, 30);
    }

    function renderLevelUI() {
        document.getElementById('lvlNum').textContent = currentLevelNumber++;
        document.getElementById('minCount').textContent = targetMinMirrors;
        resetBoard();

        document.querySelectorAll('.edge').forEach(el => el.innerHTML = '');
        currentMissions.forEach(m => {
            const startEl = document.getElementById(`edge-${m.r}-${m.c}`);
            if(startEl) startEl.innerHTML = m.id;
            const targetEl = document.getElementById(`edge-${m.targetR}-${m.targetC}`);
            if(targetEl) targetEl.innerHTML = `<span style="border-bottom: 3px solid ${m.color}">${m.id}</span>`;
        });

        document.getElementById('log').innerHTML = `✨ [신규 문제 생성 완료]\n차량 수: ${currentMissions.length}대 | AI 최소 필요 반사경: ${targetMinMirrors}개\n반사경을 효율적으로 공유하여 경로를 완성해 보세요!`;
    }

    function updateUsedCount() {
        let count = 0;
        for(let r=1; r<6; r++)
            for(let c=1; c<6; c++)
                if(grid[r][c] > 0) count++;
        document.getElementById('usedCount').textContent = count;
    }

    function resetBoard() {
        grid = Array(N).fill(0).map(() => Array(N).fill(0));
        document.querySelectorAll('.core').forEach(el => el.innerHTML = '');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateUsedCount();
    }

    function reflect(dir, mirror) {
        if (mirror === 1) { // '/'
            if (dir === 'RIGHT') return 'UP';
            if (dir === 'LEFT') return 'DOWN';
            if (dir === 'DOWN') return 'LEFT';
            if (dir === 'UP') return 'RIGHT';
        } else if (mirror === 2) { // '\'
            if (dir === 'RIGHT') return 'DOWN';
            if (dir === 'LEFT') return 'UP';
            if (dir === 'DOWN') return 'RIGHT';
            if (dir === 'UP') return 'LEFT';
        }
        return dir;
    }

    const DIRS = { 'RIGHT': {dr: 0, dc: 1}, 'LEFT': {dr: 0, dc: -1}, 'DOWN': {dr: 1, dc: 0}, 'UP': {dr: -1, dc: 0} };

    function getCenter(r, c) {
        return { x: c * (CELL_SIZE + GAP) + (CELL_SIZE / 2), y: r * (CELL_SIZE + GAP) + (CELL_SIZE / 2) };
    }

    function runSimulation() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let logText = "--- 경로 채점 진행 중 ---\n";
        const log = (msg) => logText += msg + "\n";
        
        let allSuccess = true;
        let usedMirrors = parseInt(document.getElementById('usedCount').textContent);

        for (let m of currentMissions) {
            let r = m.r, c = m.c, dir = m.dir;
            let history = new Set();
            let step = 0;
            
            ctx.beginPath();
            let startPos = getCenter(r, c);
            ctx.moveTo(startPos.x, startPos.y);
            ctx.strokeStyle = m.color;
            ctx.lineWidth = 4;

            while(step < 100) {
                step++;
                let state = `${r},${c},${dir}`;
                if (history.has(state)) {
                    log(`<span class="error">❌ [${m.id}] 무한 루프 발생!</span>`);
                    allSuccess = false;
                    break;
                }
                history.add(state);

                if (r > 0 && r < 6 && c > 0 && c < 6) {
                    let mirror = grid[r][c];
                    if (mirror > 0) dir = reflect(dir, mirror);
                }

                r += DIRS[dir].dr;
                c += DIRS[dir].dc;
                
                let nextPos = getCenter(r, c);
                ctx.lineTo(nextPos.x, nextPos.y);

                if (r < 0 || r >= N || c < 0 || c >= N) {
                    let finalR = r - DIRS[dir].dr;
                    let finalC = c - DIRS[dir].dc;
                    
                    if (finalR === m.targetR && finalC === m.targetC) {
                        log(`✅ [${m.id}] 목표 도달 완료`);
                    } else {
                        log(`<span class="error">❌ [${m.id}] 경로 이탈 (도착 지점 불일치)</span>`);
                        allSuccess = false;
                    }
                    break;
                }
            }
            ctx.stroke();
        }

        log("\n--- 최적화 최종 판정 ---");
        if (!allSuccess) {
            log(`<span class="error">⚠️ 모든 차량이 목적지에 정확히 도달해야 합니다.</span>`);
        } else {
            if (usedMirrors === targetMinMirrors) {
                log(`🎉 <span class="highlight">PERFECT! 완벽합니다!</span>`);
                log(`최소 반사경 수(${targetMinMirrors}개)로 최적화에 성공하셨습니다.`);
            } else if (usedMirrors > targetMinMirrors) {
                log(`✅ <span class="highlight">도착 성공!</span>`);
                log(`⚠️ 반사경을 더 줄여보세요! (현재: ${usedMirrors}개 / AI 최적해: ${targetMinMirrors}개)`);
            } else {
                log(`🎉 <span class="highlight">최적해 경신!</span> (${targetMinMirrors}개보다 적은 거울로 해법 달성)`);
            }
        }

        document.getElementById('log').innerHTML = logText;
    }

    // 백트래킹 최적해 탐색기 (IDDFS)
    function calculateAbsoluteMinMirrors(missions) {
        const coreCells = [];
        for (let r = 1; r <= 5; r++) {
            for (let c = 1; c <= 5; c++) coreCells.push({ r, c });
        }

        let simGrid = Array(N).fill(0).map(() => Array(N).fill(0));

        function testSolution() {
            for (let m of missions) {
                let r = m.r, c = m.c, dir = m.dir;
                let step = 0;
                while (step < 50) {
                    step++;
                    if (r > 0 && r < 6 && c > 0 && c < 6) {
                        let mir = simGrid[r][c];
                        if (mir > 0) dir = reflect(dir, mir);
                    }
                    r += DIRS[dir].dr;
                    c += DIRS[dir].dc;
                    if (r < 0 || r >= N || c < 0 || c >= N) {
                        let finalR = r - DIRS[dir].dr;
                        let finalC = c - DIRS[dir].dc;
                        if (finalR !== m.targetR || finalC !== m.targetC) return false;
                        break;
                    }
                }
                if (step >= 50) return false;
            }
            return true;
        }

        function dfs(cellIdx, count, maxK) {
            if (count === maxK) return testSolution();
            if (cellIdx >= coreCells.length) return false;
            if (count + (coreCells.length - cellIdx) < maxK) return false;

            let { r, c } = coreCells[cellIdx];

            if (dfs(cellIdx + 1, count, maxK)) return true;

            simGrid[r][c] = 1;
            if (dfs(cellIdx + 1, count + 1, maxK)) return true;

            simGrid[r][c] = 2;
            if (dfs(cellIdx + 1, count + 1, maxK)) return true;

            simGrid[r][c] = 0;
            return false;
        }

        for (let k = 1; k <= 7; k++) {
            if (dfs(0, 0, k)) return k;
        }
        return -1;
    }

    initBoard();
</script>
</body>
</html>
