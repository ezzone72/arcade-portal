<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 역량검사 - 마법약 만들기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 440px;
        }
        .top-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
            color: #007bff;
        }
        .mode-toggle-btn {
            background: #e2e8f0;
            color: #2b3a4a;
            border: 1px solid #cbd5e0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-toggle-btn.practice {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }
        .timer-gauge-bg {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .timer-gauge-fill {
            height: 100%;
            width: 100%;
            background: #dc3545;
        }

        .game-stage {
            background: #2b3a4a;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            color: white;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .target-box {
            font-size: 14px;
            margin-bottom: 10px;
            color: #a0aec0;
        }
        .target-potion {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .ingredient-panel {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
        }
        .ing-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4a5568;
            color: white;
            transition: background 0.2s;
        }
        .ing-btn:hover:not(:disabled) { background: #718096; }
        
        .selected-slots {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            align-items: center;
            background: #1a232a;
            border-radius: 8px;
            padding: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #cbd5e0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button.game-action-btn {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }
        .btn-brew { background-color: #28a745; }
        .btn-reset { background-color: #6c757d; }

        .btn-start, .btn-review {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-start { background-color: #007bff; color: white; }
        .btn-review { background-color: #17a2b8; color: white; display: none; }

        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-msg { height: 28px; margin-top: 10px; font-size: 18px; font-weight: bold; }

        /* 복기 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-content h3 { margin-top: 0; color: #2b3a4a; text-align: center; }
        
        .review-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-left: 5px solid #dc3545;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .review-card .round-title { font-weight: bold; color: #333; margin-bottom: 4px; }
        .review-card .detail { margin: 3px 0; color: #555; }
        .review-card .feedback { color: #0056b3; font-weight: bold; margin-top: 6px; background: #eef5ff; padding: 6px; border-radius: 4px; }
        
        .close-btn {
            width: 100%;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="top-tools">
        <span>잡다 마법약 만들기</span>
        <button class="mode-toggle-btn" id="mode-btn" onclick="togglePracticeMode()">🔥 실전 모드 (30초)</button>
    </div>

    <div class="info-bar">
        <span>진행: <span id="current-step">0</span> / 10</span>
        <span>점수: <span id="score">0</span></span>
    </div>

    <div class="timer-gauge-bg">
        <div class="timer-gauge-fill" id="timer-gauge"></div>
    </div>

    <div class="game-stage">
        <div class="target-box">목표 마법약 속성치 맞추기</div>
        <div class="target-potion" id="target-display">붉은기: ?, 푸른기: ?</div>
        
        <div class="selected-slots" id="selected-slots">
            재료를 선택하세요 (최대 3개)
        </div>

        <div class="ingredient-panel">
            <button class="ing-btn" onclick="addIngredient('A')">붉은초 (A)</button>
            <button class="ing-btn" onclick="addIngredient('B')">푸른버섯 (B)</button>
            <button class="ing-btn" onclick="addIngredient('C')">황금가루 (C)</button>
        </div>
    </div>

    <div class="result-msg" id="result-msg"></div>

    <div class="btn-group">
        <button class="game-action-btn btn-reset" onclick="resetSlots()" id="btn-reset" disabled>다시 선택</button>
        <button class="game-action-btn btn-brew" onclick="brewPotion()" id="btn-brew" disabled>물약 제조하기</button>
    </div>

    <button class="btn-start" id="btn-start" onclick="startGame()">테스트 시작 (10문항)</button>
    <button class="btn-review" id="btn-review" onclick="toggleModal(true)">📋 전략 피드백 복기 리포트</button>
</div>

<div class="modal-overlay" id="review-modal">
    <div class="modal-content">
        <h3>📋 추론 과정 및 전략 피드백</h3>
        <div id="review-list"></div>
        <button class="close-btn" onclick="toggleModal(false)">닫기</button>
    </div>
</div>

<script>
    const totalRounds = 10;
    let currentRound = 0;
    let score = 0;
    let timer = null;
    let timeLimitMs = 30000; // 실전 30초
    let isPracticeMode = false;

    let selectedIngredients = [];
    let currentTarget = { red: 0, blue: 0 };
    let wrongQuestions = [];

    // 재료별 기여도 규칙 (A: 붉은기+2, 푸른기+0 / B: 붉은기+0, 푸른기+2 / C: 붉은기+1, 푸른기+1)
    const ingredientWeights = {
        'A': { red: 2, blue: 0, name: '붉은초(A)' },
        'B': { red: 0, blue: 2, name: '푸른버섯(B)' },
        'C': { red: 1, blue: 1, name: '황금가루(C)' }
    };

    function togglePracticeMode() {
        if (currentRound > 0 && currentRound < totalRounds) return;
        isPracticeMode = !isPracticeMode;
        const btn = document.getElementById('mode-btn');

        if (isPracticeMode) {
            timeLimitMs = 60000; // 연습 모드 60초
            btn.innerText = "⚡ 연습 모드 (60초)";
            btn.classList.add('practice');
        } else {
            timeLimitMs = 30000;
            btn.innerText = "🔥 실전 모드 (30초)";
            btn.classList.remove('practice');
        }
    }

    function resetTimerGauge() {
        const gauge = document.getElementById('timer-gauge');
        gauge.style.transition = 'none';
        gauge.style.width = '100%';
        void gauge.offsetWidth;
        gauge.style.transition = `width ${timeLimitMs / 1000}s linear`;
        gauge.style.width = '0%';
    }

    function startGame() {
        currentRound = 0;
        score = 0;
        wrongQuestions = [];
        document.getElementById('score').innerText = score;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('mode-btn').disabled = true;
        document.getElementById('btn-review').style.display = 'none';
        nextRound();
    }

    function nextRound() {
        if (currentRound >= totalRounds) {
            endGame();
            return;
        }

        currentRound++;
        selectedIngredients = [];
        updateSlotsUI();
        document.getElementById('current-step').innerText = currentRound;
        document.getElementById('result-msg').innerText = "";

        // 무작위 유효 타겟 생성 (A, B, C 조합으로 만들어질 수 있는 목표값 설정)
        const sampleCount = 3;
        let r = 0, b = 0;
        let generatedCombo = [];
        const keys = ['A', 'B', 'C'];
        for(let i=0; i<sampleCount; i++) {
            let pick = keys[Math.floor(Math.random() * keys.length)];
            generatedCombo.push(pick);
            r += ingredientWeights[pick].red;
            b += ingredientWeights[pick].blue;
        }

        currentTarget = { red: r, blue: b, correctCombo: generatedCombo.sort() };

        document.getElementById('target-display').innerText = `🎯 목표 -> 붉은기: ${r} | 푸른기: ${b}`;

        setControlsEnabled(true);
        resetTimerGauge();

        timer = setTimeout(() => {
            handleTimeout();
        }, timeLimitMs);
    }

    function setControlsEnabled(enabled) {
        document.getElementById('btn-brew').disabled = !enabled;
        document.getElementById('btn-reset').disabled = !enabled;
    }

    function addIngredient(ing) {
        if (selectedIngredients.length < 3) {
            selectedIngredients.push(ing);
            updateSlotsUI();
        }
    }

    function resetSlots() {
        selectedIngredients = [];
        updateSlotsUI();
    }

    function updateSlotsUI() {
        const slotEl = document.getElementById('selected-slots');
        if (selectedIngredients.length === 0) {
            slotEl.innerText = "재료를 선택하세요 (최대 3개)";
        } else {
            slotEl.innerText = selectedIngredients.map(i => `${ingredientWeights[i].name}`).join(' + ');
        }
    }

    function handleTimeout() {
        setControlsEnabled(false);
        document.getElementById('result-msg').innerText = "⏱️ 시간 초과!";
        document.getElementById('result-msg').style.color = "orange";

        wrongQuestions.push({
            round: currentRound,
            target: currentTarget,
            userChoice: "시간 초과",
            correctComboStr: currentTarget.correctCombo.map(i => ingredientWeights[i].name).join(' + '),
            feedback: `제한 시간 안에 각 재료의 기여도(A:붉은기+2/B:푸른기+2/C:각+1)를 역산하여 조합하는 연습이 필요합니다. 각 재료가 목표 수치에 미치는 가중치를 먼저 빼나가는 방식을 적용해 보세요.`
        });

        setTimeout(nextRound, 1000);
    }

    function brewPotion() {
        if (selectedIngredients.length === 0) return;
        clearTimeout(timer);
        setControlsEnabled(false);

        // 유저 조합 정렬 후 비교
        const userSorted = [...selectedIngredients].sort();
        const targetSorted = [...currentTarget.correctCombo].sort();

        const isMatch = JSON.stringify(userSorted) === JSON.stringify(targetSorted);

        if (isMatch) {
            score += 10;
            document.getElementById('result-msg').innerText = "⭕ 정답!";
            document.getElementById('result-msg').style.color = "#28a745";
        } else {
            document.getElementById('result-msg').innerText = "❌ 오답!";
            document.getElementById('result-msg').style.color = "#dc3545";

            wrongQuestions.push({
                round: currentRound,
                target: currentTarget,
                userChoice: selectedIngredients.map(i => ingredientWeights[i].name).join(' + '),
                correctComboStr: currentTarget.correctCombo.map(i => ingredientWeights[i].name).join(' + '),
                feedback: `목표 수치(붉은기: ${currentTarget.red}, 푸른기: ${currentTarget.blue})를 맞추려면 각 성분의 가중치를 분석해야 합니다. 붉은기를 우선 맞추기 위해 '붉은초(A)'나 '황금가루(C)'를 배치한 뒤 부족한 푸른기를 '푸른버섯(B)'으로 채우는 체계적인 역산 사고법이 요구됩니다.`
            });
        }

        document.getElementById('score').innerText = score;
        setTimeout(nextRound, 800);
    }

    function endGame() {
        clearTimeout(timer);
        const gauge = document.getElementById('timer-gauge');
        gauge.style.transition = 'none';
        gauge.style.width = '0%';

        document.getElementById('result-msg').innerText = `테스트 종료! 최종 점수: ${score}점`;
        document.getElementById('result-msg').style.color = "#007bff";
        document.getElementById('btn-start').disabled = false;
        document.getElementById('mode-btn').disabled = false;

        if (wrongQuestions.length > 0) {
            document.getElementById('btn-review').style.display = 'block';
        } else {
            document.getElementById('result-msg').innerText += " (만점!)";
        }
    }

    function renderReviewList() {
        const container = document.getElementById('review-list');
        container.innerHTML = "";

        wrongQuestions.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML = `
                <div class="round-title">📌 문제 ${item.round}번 전략 분석</div>
                <div class="detail">· 목표 속성: 붉은기 ${item.target.red}, 푸른기 ${item.target.blue}</div>
                <div class="detail">· 내가 고른 조합: <b>${item.userChoice}</b></div>
                <div class="detail">· 정답 조합: <b style="color:#28a745">${item.correctComboStr}</b></div>
                <div class="feedback">💡 실체적 추론 피드백: ${item.feedback}</div>
            `;
            container.appendChild(card);
        });
    }

    function toggleModal(show) {
        if (show) renderReviewList();
        document.getElementById('review-modal').style.display = show ? 'flex' : 'none';
    }
</script>

</body>
</html>
