<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고스톱 (맞고) - sojang ai Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0b532c; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        
        /* 상단 UI 패널 */
        .top-nav { position: absolute; top: 12px; right: 12px; z-index: 20; }
        .home-btn { background: rgba(0,0,0,0.6); color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 16px; font-weight: bold; text-decoration: none; font-size: 12px; }

        .status-bar { display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }

        /* 카드 플레이 영역 */
        .board-zone { flex: 1; display: grid; grid-template-rows: 1fr 1.3fr 1fr; gap: 8px; margin: 10px 0; }
        .hand-area, .field-area { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 10px; position: relative; border: 1px inset rgba(255,255,255,0.05); }
        
        /* 화투 패 디자인 */
        .card { width: 50px; height: 78px; background-color: #c0392b; border: 2px solid #fff; border-radius: 6px; cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; position: relative; box-shadow: 2px 3px 6px rgba(0,0,0,0.4); }
        .card:hover { transform: translateY(-6px); }
        .card.selected { border-color: #f1c40f; box-shadow: 0 0 12px #f1c40f; }
        .card-back { background: radial-gradient(circle, #e74c3c 0%, #900c3f 100%); border-color: #7d0a2e; }
        .card-tag { position: absolute; bottom: 2px; right: 4px; font-size: 9px; background: rgba(0,0,0,0.6); padding: 1px 3px; border-radius: 3px; }

        /* 모달 시스템 */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .modal-content { background: #1e293b; border: 2px solid #f1c40f; padding: 24px; border-radius: 16px; text-align: center; max-width: 90%; }
        .modal h2 { font-size: 26px; color: #f1c40f; margin-bottom: 12px; }
        .btn-action { padding: 10px 24px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; background: #2ecc71; color: #fff; margin-top: 16px; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 상대방 영역 -->
    <div class="status-bar">
        <span>🤖 상대방 (AI)</span>
        <span>획득 패: <span id="ai-score">0</span>장</span>
    </div>

    <!-- 중앙 게임 필드 -->
    <div class="board-zone">
        <div id="ai-hand" class="hand-area"></div>
        <div id="field-deck" class="field-area"></div>
        <div id="player-hand" class="hand-area"></div>
    </div>

    <!-- 플레이어 영역 -->
    <div class="status-bar">
        <span>👤 플레이어 (나)</span>
        <span>획득 패: <span id="player-score">0</span>장</span>
    </div>

    <div class="top-nav">
        <a href="../../index.html" class="home-btn">🏠 로비</a>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">게임 결과</h2>
            <p id="modal-desc">결과 표시 영역</p>
            <button class="btn-action" onclick="restartGame()">다음 판 플레이</button>
        </div>
    </div>
</div>

<script>
// 1월~12월 화투패 기본 데이터
const monthNames = ["1월(송학)", "2월(매화)", "3월(벚꽃)", "4월(흑싸리)", "5월(난초)", "6월(모란)", "7월(홍싸리)", "8월(공산)", "9월(국진)", "10월(단풍)", "11월(오동)", "12월(비)"];
const types = ["광/피", "띠", "피1", "피2"];

let deck = [];
let playerHand = [], aiHand = [], field = [];
let playerCaptured = [], aiCaptured = [];

function createDeck() {
    deck = [];
    for (let m = 1; m <= 12; m++) {
        for (let t = 0; t < 4; t++) {
            deck.push({
                month: m,
                type: types[t],
                id: `${m}-${t}`,
                name: `${m}월`,
                desc: monthNames[m-1]
            });
        }
    }
    deck.sort(() => Math.random() - 0.5);
}

function initGame() {
    createDeck();
    playerHand = deck.splice(0, 10);
    aiHand = deck.splice(0, 10);
    field = deck.splice(0, 8);
    playerCaptured = [];
    aiCaptured = [];
    
    document.getElementById('result-modal').style.display = 'none';
    render();
}

function render() {
    // 1. 플레이어 패 렌더링
    const pHandEl = document.getElementById('player-hand');
    pHandEl.innerHTML = '';
    playerHand.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<div>${card.name}</div><div class="card-tag">${card.type}</div>`;
        el.onclick = () => playTurn(idx);
        pHandEl.appendChild(el);
    });

    // 2. AI 패 렌더링 (뒷면)
    const aiHandEl = document.getElementById('ai-hand');
    aiHandEl.innerHTML = '';
    aiHand.forEach(() => {
        const el = document.createElement('div');
        el.className = 'card card-back';
        el.innerHTML = `🎴`;
        aiHandEl.appendChild(el);
    });

    // 3. 바닥 패 렌더링
    const fieldEl = document.getElementById('field-deck');
    fieldEl.innerHTML = '';
    field.forEach((card) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.style.backgroundColor = '#9b59b6';
        el.innerHTML = `<div>${card.name}</div><div class="card-tag">${card.type}</div>`;
        fieldEl.appendChild(el);
    });

    // 점수 및 획득 상태 갱신
    document.getElementById('player-score').innerText = playerCaptured.length;
    document.getElementById('ai-score').innerText = aiCaptured.length;
}

function playTurn(idx) {
    const card = playerHand.splice(idx, 1)[0];
    const matchIdx = field.findIndex(f => f.month === card.month);

    if (matchIdx !== -1) {
        const matched = field.splice(matchIdx, 1)[0];
        playerCaptured.push(card, matched);
    } else {
        field.push(card);
    }

    render();

    if (playerHand.length === 0 && aiHand.length === 0) {
        endGame();
        return;
    }

    setTimeout(aiTurn, 600);
}

function aiTurn() {
    if (aiHand.length === 0) {
        endGame();
        return;
    }

    let aiCardIdx = aiHand.findIndex(c => field.some(f => f.month === c.month));
    if (aiCardIdx === -1) aiCardIdx = 0;

    const card = aiHand.splice(aiCardIdx, 1)[0];
    const matchIdx = field.findIndex(f => f.month === card.month);

    if (matchIdx !== -1) {
        const matched = field.splice(matchIdx, 1)[0];
        aiCaptured.push(card, matched);
    } else {
        field.push(card);
    }

    render();

    if (playerHand.length === 0 && aiHand.length === 0) {
        endGame();
    }
}

function endGame() {
    const pCount = playerCaptured.length;
    const aiCount = aiCaptured.length;
    
    document.getElementById('modal-title').innerText = pCount >= aiCount ? "🎉 승리!" : "😭 패배!";
    document.getElementById('modal-desc').innerText = `최종 획득 카운트\n나: ${pCount}장 vs AI: ${aiCount}장`;
    document.getElementById('result-modal').style.display = 'flex';
}

function restartGame() {
    initGame();
}

initGame();
</script>
</body>
</html>
