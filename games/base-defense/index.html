<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단일 타워 기지 디펜스 - sojang ai Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; height: 100%; }
        
        .top-nav { position: absolute; top: 10px; right: 10px; z-index: 20; }
        .home-btn { background: rgba(30, 41, 59, 0.8); color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 16px; font-weight: bold; text-decoration: none; font-size: 12px; }

        .header-status { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 20; font-size: 11px; font-weight: bold; flex-wrap: wrap; }
        .stat-card { background: rgba(15, 23, 42, 0.85); padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
        .gold-text { color: #facc15; }
        .hp-text { color: #ef4444; }

        .upgrade-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 20; max-width: 95%; overflow-x: auto; }
        .up-btn { background: #1e293b; color: #f8fafc; border: 1px solid #38bdf8; padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .up-btn:active { background: #38bdf8; color: #0f172a; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-status">
        <div class="stat-card">🪙 골드: <span id="gold-val" class="gold-text">100</span></div>
        <div class="stat-card">❤️ 기지 HP: <span id="hp-val" class="hp-text">100/100</span></div>
        <div class="stat-card">🌊 Wave: <span id="wave-val" style="color:#38bdf8;">1</span></div>
    </div>

    <div class="top-nav">
        <a href="../../index.html" class="home-btn">🏠 로비</a>
    </div>

    <div class="upgrade-bar">
        <button class="up-btn" onclick="upgrade('atk')">⚔️ 공격력 (50G)</button>
        <button class="up-btn" onclick="upgrade('speed')">⚡ 공속 (60G)</button>
        <button class="up-btn" onclick="upgrade('range')">🎯 사거리 (40G)</button>
        <button class="up-btn" onclick="upgrade('repair')">🛠️ 수리 (30G)</button>
    </div>

    <canvas id="defenseCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('defenseCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let gold = 100, hp = 100, maxHp = 100, wave = 1;
let tower = { x: 0, y: 0, range: 120, atk: 15, cooldown: 0, maxCooldown: 30 };
let enemies = [], bullets = [];

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    tower.x = width / 2;
    tower.y = height / 2;
}
window.addEventListener('resize', resize);

function spawnEnemy() {
    let angle = Math.random() * Math.PI * 2;
    let dist = Math.max(width, height) / 2 + 50;
    enemies.push({
        x: tower.x + Math.cos(angle) * dist,
        y: tower.y + Math.sin(angle) * dist,
        hp: 20 + wave * 5,
        maxHp: 20 + wave * 5,
        speed: 1.2 + Math.random() * 0.5
    });
}

setInterval(spawnEnemy, 1500);

function upgrade(type) {
    if (type === 'atk' && gold >= 50) { gold -= 50; tower.atk += 5; }
    else if (type === 'speed' && gold >= 60 && tower.maxCooldown > 10) { gold -= 60; tower.maxCooldown -= 3; }
    else if (type === 'range' && gold >= 40) { gold -= 40; tower.range += 20; }
    else if (type === 'repair' && gold >= 30 && hp < maxHp) { gold -= 30; hp = Math.min(maxHp, hp + 30); }
    updateUI();
}

function updateUI() {
    document.getElementById('gold-val').innerText = gold;
    document.getElementById('hp-val').innerText = `${hp}/${maxHp}`;
    document.getElementById('wave-val').innerText = wave;
}

function render() {
    ctx.clearRect(0, 0, width, height);

    // 1. 기지 본체
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 30, 0, Math.PI * 2);
    ctx.fill();

    // 사거리 표시
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
    ctx.stroke();

    // 2. 타워 타겟팅 & 조준
    tower.cooldown--;
    if (tower.cooldown <= 0 && enemies.length > 0) {
        let target = enemies.find(e => Math.hypot(e.x - tower.x, e.y - tower.y) <= tower.range);
        if (target) {
            bullets.push({ x: tower.x, y: tower.y, tx: target.x, ty: target.y, speed: 8 });
            tower.cooldown = tower.maxCooldown;
        }
    }

    // 3. 총알 이동
    bullets.forEach((b, bIdx) => {
        let dx = b.tx - b.x;
        let dy = b.ty - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 10) {
            let enemy = enemies.find(e => Math.hypot(e.x - b.tx, e.y - b.ty) < 20);
            if (enemy) {
                enemy.hp -= tower.atk;
                if (enemy.hp <= 0) {
                    gold += 10;
                    enemies = enemies.filter(e => e !== enemy);
                    updateUI();
                }
            }
            bullets.splice(bIdx, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // 4. 적 이동 및 기지 충돌
    enemies.forEach((e, eIdx) => {
        let dx = tower.x - e.x;
        let dy = tower.y - e.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 30) {
            hp -= 10;
            enemies.splice(eIdx, 1);
            updateUI();
        } else {
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(e.x, e.y, 10, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    requestAnimationFrame(render);
}

resize();
updateUI();
render();
</script>
</body>
</html>
