<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단일 타워 기지 디펜스 - sojang ai Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; height: 100%; background: #0b1329; }
        
        .top-nav { position: absolute; top: 10px; right: 10px; z-index: 20; }
        .home-btn { background: rgba(30, 41, 59, 0.85); color: #38bdf8; border: 1px solid #38bdf8; padding: 5px 10px; border-radius: 14px; font-weight: bold; text-decoration: none; font-size: 11px; }

        .header-status { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 20; font-size: 11px; font-weight: bold; flex-wrap: wrap; }
        .stat-card { background: rgba(15, 23, 42, 0.85); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); }
        .gold-text { color: #facc15; }
        .hp-text { color: #ef4444; }

        .upgrade-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 20; max-width: 98%; overflow-x: auto; padding: 2px; }
        .up-btn { background: #1e293b; color: #f8fafc; border: 1px solid #38bdf8; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.1s; }
        .up-btn:active { background: #38bdf8; color: #0f172a; }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .modal-content { background: #1e293b; border: 2px solid #ef4444; padding: 20px; border-radius: 16px; text-align: center; max-width: 90%; }
        .modal h2 { font-size: 22px; color: #ef4444; margin-bottom: 8px; }
        .modal p { font-size: 13px; color: #e2e8f0; margin-bottom: 16px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn-action { padding: 8px 16px; font-size: 13px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; }
        .btn-restart { background: #38bdf8; color: #0f172a; }
        .btn-lobby { background: #64748b; color: #fff; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-status">
        <div class="stat-card">🪙 골드: <span id="gold-val" class="gold-text">100</span></div>
        <div class="stat-card">❤️ HP: <span id="hp-val" class="hp-text">100/100</span></div>
        <div class="stat-card">🌊 웨이브: <span id="wave-val" style="color:#38bdf8;">1</span></div>
    </div>

    <div class="top-nav">
        <a href="../../index.html" class="home-btn">🏠 로비</a>
    </div>

    <div class="upgrade-bar">
        <button class="up-btn" onclick="upgrade('atk')">⚔️ 공(+5) [50G]</button>
        <button class="up-btn" onclick="upgrade('speed')">⚡ 공속 (+10%) [60G]</button>
        <button class="up-btn" onclick="upgrade('range')">🎯 사거리 (+20) [40G]</button>
        <button class="up-btn" onclick="upgrade('repair')">🛠️ 수리 (+30) [30G]</button>
    </div>

    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <h2>기지 파괴됨!</h2>
            <p id="gameover-desc">최종 기록: 웨이브 1</p>
            <div class="btn-group">
                <button class="btn-action btn-restart" onclick="initGame()">다시 도전</button>
                <a href="../../index.html" class="btn-action btn-lobby">로비로 이동</a>
            </div>
        </div>
    </div>

    <canvas id="defenseCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('defenseCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let scaleRatio = 1; // 화면 크기에 비례하는 동적 스케일 값
let gold = 100, hp = 100, maxHp = 100, wave = 1;
let killCount = 0;

let tower = { x: 0, y: 0, baseRadius: 24, baseRange: 120, range: 120, atk: 15, cooldown: 0, maxCooldown: 25 };
let enemies = [];
let bullets = [];
let spawnIntervalTimer = null;
let isGameOver = false;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    // 기기 화면 해상도에 맞춰 모든 요소의 크기를 유연하게 비례 계산 (기준 800x600)
    scaleRatio = Math.min(width / 800, height / 600);

    tower.x = width / 2;
    tower.y = height / 2;
    tower.range = tower.baseRange * scaleRatio;
}
window.addEventListener('resize', resize);

class Enemy {
    constructor() {
        let angle = Math.random() * Math.PI * 2;
        let dist = Math.max(width, height) / 2 + 50;
        this.x = tower.x + Math.cos(angle) * dist;
        this.y = tower.y + Math.sin(angle) * dist;
        this.baseRadius = 9;
        this.hp = 20 + (wave - 1) * 8;
        this.maxHp = this.hp;
        this.speed = (1.2 + Math.random() * 0.4) * scaleRatio;
    }

    update() {
        let dx = tower.x - this.x;
        let dy = tower.y - this.y;
        let dist = Math.hypot(dx, dy);

        let hitRadius = (tower.baseRadius + this.baseRadius) * scaleRatio;

        if (dist < hitRadius) {
            hp -= 10;
            updateUI();
            if (hp <= 0) gameOver();
            return true;
        }

        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
        return false;
    }

    draw() {
        const radius = this.baseRadius * scaleRatio;
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // 적 체력바 크기 비례 적용
        const barW = 18 * scaleRatio;
        const barH = 3 * scaleRatio;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(this.x - barW / 2, this.y - radius - 5 * scaleRatio, barW, barH);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(this.x - barW / 2, this.y - radius - 5 * scaleRatio, barW * (this.hp / this.maxHp), barH);
    }
}

class Bullet {
    constructor(target) {
        this.x = tower.x;
        this.y = tower.y;
        this.target = target;
        this.speed = 9 * scaleRatio;
        this.baseRadius = 4.5;
    }

    update() {
        if (!enemies.includes(this.target)) return true;

        let dx = this.target.x - this.x;
        let dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 10 * scaleRatio) {
            this.target.hp -= tower.atk;
            if (this.target.hp <= 0) {
                gold += 12;
                killCount++;
                if (killCount % 10 === 0) wave++;
                enemies = enemies.filter(e => e !== this.target);
                updateUI();
            }
            return true;
        }

        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
        return false;
    }

    draw() {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.baseRadius * scaleRatio, 0, Math.PI * 2);
        ctx.fill();
    }
}

function spawnEnemy() {
    if (isGameOver) return;
    enemies.push(new Enemy());
}

function upgrade(type) {
    if (isGameOver) return;
    if (type === 'atk' && gold >= 50) { gold -= 50; tower.atk += 5; }
    else if (type === 'speed' && gold >= 60 && tower.maxCooldown > 8) { gold -= 60; tower.maxCooldown = Math.max(6, tower.maxCooldown - 3); }
    else if (type === 'range' && gold >= 40) { gold -= 40; tower.baseRange += 20; tower.range = tower.baseRange * scaleRatio; }
    else if (type === 'repair' && gold >= 30 && hp < maxHp) { gold -= 30; hp = Math.min(maxHp, hp + 30); }
    updateUI();
}

function updateUI() {
    document.getElementById('gold-val').innerText = gold;
    document.getElementById('hp-val').innerText = `${Math.max(0, hp)}/${maxHp}`;
    document.getElementById('wave-val').innerText = wave;
}

function gameOver() {
    isGameOver = true;
    clearInterval(spawnIntervalTimer);
    document.getElementById('gameover-desc').innerText = `최종 기록: 웨이브 ${wave} (처치: ${killCount} 마리)`;
    document.getElementById('gameover-modal').style.display = 'flex';
}

function initGame() {
    resize();
    gold = 100;
    hp = 100;
    maxHp = 100;
    wave = 1;
    killCount = 0;
    isGameOver = false;

    tower.baseRange = 120;
    tower.range = tower.baseRange * scaleRatio;
    tower.atk = 15;
    tower.maxCooldown = 25;
    tower.cooldown = 0;

    enemies = [];
    bullets = [];

    document.getElementById('gameover-modal').style.display = 'none';
    updateUI();

    if (spawnIntervalTimer) clearInterval(spawnIntervalTimer);
    spawnIntervalTimer = setInterval(spawnEnemy, 1200);
}

function render() {
    ctx.clearRect(0, 0, width, height);

    // 1. 사거리 링 (비율 반영)
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
    ctx.lineWidth = 2 * scaleRatio;
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
    ctx.stroke();

    // 2. 메인 중앙 기지 (화면 크기에 맞춰 동적 축소/확대)
    const towerRadius = tower.baseRadius * scaleRatio;
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, towerRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3 * scaleRatio;
    ctx.stroke();

    if (!isGameOver) {
        tower.cooldown--;
        if (tower.cooldown <= 0 && enemies.length > 0) {
            let target = enemies.find(e => Math.hypot(e.x - tower.x, e.y - tower.y) <= tower.range);
            if (target) {
                bullets.push(new Bullet(target));
                tower.cooldown = tower.maxCooldown;
            }
        }

        bullets = bullets.filter(b => {
            let removed = b.update();
            if (!removed) b.draw();
            return !removed;
        });

        enemies = enemies.filter(e => {
            let removed = e.update();
            if (!removed) e.draw();
            return !removed;
        });
    }

    requestAnimationFrame(render);
}

initGame();
render();
</script>
</body>
</html>
