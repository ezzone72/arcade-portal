<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단일 타워 기지 디펜스 - sojang ai Arcade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #0b0c10; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; height: 100%; background: #1f2833; }
        
        .top-nav { position: absolute; top: 12px; right: 12px; z-index: 20; }
        .home-btn { background: rgba(30, 41, 59, 0.85); color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 16px; font-weight: bold; text-decoration: none; font-size: 12px; }

        .header-status { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; font-size: 12px; font-weight: bold; flex-wrap: wrap; }
        .stat-card { background: rgba(0,0,0,0.65); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); text-shadow: 1px 1px 2px #000; }
        .gold-text { color: #f1c40f; }
        .wave-text { color: #e74c3c; }
        .hp-text { color: #2ecc71; }
        .cheat-badge { color: #a855f7; border-color: #a855f7; }

        .upgrade-panel { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); z-index: 20; max-width: 95%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .up-btn { background: #34495e; color: #fff; border: 1px solid #5d6d7e; border-radius: 10px; padding: 8px 12px; font-size: 12px; cursor: pointer; text-align: center; min-width: 95px; flex-shrink: 0; transition: 0.1s; }
        .up-btn:active { background: #4a6572; transform: scale(0.95); }
        .up-btn span { display: block; font-size: 10px; color: #f1c40f; margin-top: 2px; }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .modal-content { background: #1e293b; border: 2px solid #e74c3c; padding: 24px; border-radius: 16px; text-align: center; max-width: 90%; }
        .modal h2 { font-size: 28px; color: #e74c3c; margin-bottom: 10px; }
        .modal p { font-size: 16px; color: #e2e8f0; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn-action { padding: 10px 22px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; text-decoration: none; }
        .btn-restart { background: #2ecc71; color: #fff; }
        .btn-lobby { background: #64748b; color: #fff; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header-status">
        <div class="stat-card">💰 골드: <span id="gold" class="gold-text">100</span></div>
        <div class="stat-card">🌊 웨이브: <span id="wave" class="wave-text">1</span></div>
        <div class="stat-card">❤️ 체력: <span id="hp" class="hp-text">100 / 100</span></div>
        <div class="stat-card cheat-badge" id="cheat-status" style="display:none;">⚡ 치트: 적 속도 -10%</div>
    </div>

    <div class="top-nav">
        <a href="../../index.html" class="home-btn">🏠 로비</a>
    </div>

    <div class="upgrade-panel">
        <button class="up-btn" onclick="upgrade('damage')">⚔️ 공격력 (Lv.<span id="lvl-damage">1</span>)<span id="cost-damage">50G</span></button>
        <button class="up-btn" onclick="upgrade('speed')">⚡ 공속 (Lv.<span id="lvl-speed">1</span>)<span id="cost-speed">75G</span></button>
        <button class="up-btn" onclick="upgrade('range')">🎯 사거리 (Lv.<span id="lvl-range">1</span>)<span id="cost-range">60G</span></button>
        <button class="up-btn" onclick="upgrade('multi')">🏹 멀티샷 (Lv.<span id="lvl-multi">1</span>)<span id="cost-multi">150G</span></button>
        <button class="up-btn" onclick="upgrade('repair')">🔧 수리 (+40)<span>50G</span></button>
    </div>

    <div id="game-over" class="modal">
        <div class="modal-content">
            <h2>기지 함락!</h2>
            <p>최종 방어 웨이브: <span id="final-wave" style="color:#f1c40f; font-weight:bold;">1</span></p>
            <div class="btn-group">
                <button class="btn-action btn-restart" onclick="resetGame()">다시 시작</button>
                <a href="../../index.html" class="btn-action btn-lobby">로비로 이동</a>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height, scaleRatio = 1;
let gold = 100;
let wave = 1;
let isGameOver = false;

let waveFirstEnemyChecked = false;
let targetCheatUpgrade = null;
let isCheatActive = false;
let hasUpgradedThisWave = false;

const tower = {
    x: 0, y: 0, baseRadius: 26, baseRange: 160, range: 160,
    hp: 100, maxHp: 100,
    damage: 15,
    attackSpeed: 1,
    targets: 1,
    cooldown: 0,
    levels: { damage: 1, speed: 1, range: 1, multi: 1 },
    costs: { damage: 50, speed: 75, range: 60, multi: 150 }
};

let enemies = [];
let bullets = [];
let particles = [];
let waveTimer = 0;
let enemiesToSpawn = 10;
let spawnedCount = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    scaleRatio = Math.min(width / 800, height / 600);
    if (scaleRatio < 0.7) scaleRatio = 0.7;

    tower.x = width / 2;
    tower.y = height / 2;
    tower.range = tower.baseRange * scaleRatio;
}
window.addEventListener('resize', resize);

class Enemy {
    constructor() {
        let side = Math.floor(Math.random() * 4);
        if (side === 0) { this.x = Math.random() * width; this.y = -30; }
        else if (side === 1) { this.x = width + 30; this.y = Math.random() * height; }
        else if (side === 2) { this.x = Math.random() * width; this.y = height + 30; }
        else { this.x = -30; this.y = Math.random() * height; }

        let hpBonus = (wave - 1) * 15;
        this.maxHp = 30 + hpBonus;
        this.hp = this.maxHp;
        
        let speedMultiplier = isCheatActive ? 0.9 : 1.0;
        this.speed = (1.2 + Math.random() * 0.4) * scaleRatio * speedMultiplier;
        
        this.baseRadius = 11;
        this.reward = 10 + wave * 2;
    }

    update() {
        let angle = Math.atan2(tower.y - this.y, tower.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        let dist = Math.hypot(this.x - tower.x, this.y - tower.y);
        if (!waveFirstEnemyChecked && dist <= tower.range) {
            waveFirstEnemyChecked = true;
            this.calculateCheatAngle();
        }
    }

    calculateCheatAngle() {
        let rad = Math.atan2(this.y - tower.y, this.x - tower.x);
        let deg = rad * (180 / Math.PI);
        if (deg < 0) deg += 360;

        if (deg >= 0 && deg < 90) {
            targetCheatUpgrade = 'damage';
        } else if (deg >= 90 && deg < 180) {
            targetCheatUpgrade = 'speed';
        } else if (deg >= 180 && deg < 270) {
            targetCheatUpgrade = 'range';
        } else {
            targetCheatUpgrade = 'multi';
        }
    }

    draw() {
        const radius = this.baseRadius * scaleRatio;
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
        ctx.closePath();

        const barW = 22 * scaleRatio;
        const barH = 4 * scaleRatio;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(this.x - barW / 2, this.y - radius - 6 * scaleRatio, barW, barH);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - barW / 2, this.y - radius - 6 * scaleRatio, (Math.max(0, this.hp) / this.maxHp) * barW, barH);
    }
}

class Bullet {
    constructor(startX, startY, targetEnemy, damage) {
        this.x = startX;
        this.y = startY;
        this.target = targetEnemy;
        this.damage = damage;
        this.speed = 9 * scaleRatio;
        this.baseRadius = 4;
    }

    update() {
        if (!this.target || this.target.hp <= 0) return true;

        let angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        let dist = Math.hypot(this.target.x - this.x, this.target.y - this.y);
        if (dist < (this.target.baseRadius * scaleRatio) + (this.baseRadius * scaleRatio)) {
            this.target.hp -= this.damage;
            createParticles(this.x, this.y, '#f1c40f');
            return true;
        }
        return false;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.baseRadius * scaleRatio, 0, Math.PI * 2);
        ctx.fillStyle = '#f1c40f';
        ctx.fill();
        ctx.closePath();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 5 * scaleRatio;
        this.vy = (Math.random() - 0.5) * 5 * scaleRatio;
        this.alpha = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.05; }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5 * scaleRatio, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

function createParticles(x, y, color) {
    for(let i=0; i<6; i++) particles.push(new Particle(x, y, color));
}

function init() {
    resize();
    gold = 100;
    wave = 1;
    isGameOver = false;
    tower.hp = 100; tower.maxHp = 100;
    tower.damage = 15; tower.attackSpeed = 1; tower.baseRange = 160; tower.range = 160 * scaleRatio; tower.targets = 1;
    tower.levels = { damage: 1, speed: 1, range: 1, multi: 1 };
    tower.costs = { damage: 50, speed: 75, range: 60, multi: 150 };

    enemies = []; bullets = []; particles = [];
    spawnedCount = 0; enemiesToSpawn = 10;
    
    waveFirstEnemyChecked = false;
    targetCheatUpgrade = null;
    isCheatActive = false;
    hasUpgradedThisWave = false;

    document.getElementById('game-over').style.display = 'none';
    updateUI();
}

function upgrade(type) {
    if (isGameOver) return;

    if (type === 'repair') {
        if (gold >= 50 && tower.hp < tower.maxHp) {
            gold -= 50;
            tower.hp = Math.min(tower.maxHp, tower.hp + 40);
        }
    } else if (gold >= tower.costs[type]) {
        gold -= tower.costs[type];
        tower.levels[type]++;
        
        if (type === 'damage') tower.damage += 10;
        if (type === 'speed') tower.attackSpeed += 0.3;
        if (type === 'range') { tower.baseRange += 30; tower.range = tower.baseRange * scaleRatio; }
        if (type === 'multi') tower.targets += 1;

        tower.costs[type] = Math.floor(tower.costs[type] * 1.5);

        if (!hasUpgradedThisWave && targetCheatUpgrade && type === targetCheatUpgrade) {
            applySpeedCheat();
        }
        hasUpgradedThisWave = true;
    }
    updateUI();
}

function applySpeedCheat() {
    isCheatActive = true;
    enemies.forEach(e => {
        e.speed *= 0.9;
    });
    document.getElementById('cheat-status').style.display = 'inline-block';
}

function updateUI() {
    document.getElementById('gold').innerText = gold;
    document.getElementById('wave').innerText = wave;
    document.getElementById('hp').innerText = `${Math.ceil(tower.hp)} / ${tower.maxHp}`;
    document.getElementById('cheat-status').style.display = isCheatActive ? 'inline-block' : 'none';
    
    ['damage', 'speed', 'range', 'multi'].forEach(type => {
        document.getElementById(`lvl-${type}`).innerText = tower.levels[type];
        document.getElementById(`cost-${type}`).innerText = `${tower.costs[type]}G`;
    });
}

function gameOver() {
    isGameOver = true;
    document.getElementById('final-wave').innerText = wave;
    document.getElementById('game-over').style.display = 'flex';
}

function resetGame() { init(); }

function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, width, height);

    if (isGameOver) return;

    // 1. 스폰 간격 계산 (최소 25프레임)
    const waveTier = Math.floor((wave - 1) / 5);
    const spawnInterval = Math.max(25, Math.floor(50 * Math.pow(0.9, waveTier)));

    // 2. 동시 스폰 마릿수 계산 (30W 이상부터 5웨이브마다 2배씩 폭증)
    let spawnBatchCount = 1;
    if (wave >= 15 && wave < 30) {
        spawnBatchCount = 1 + Math.floor((wave - 10) / 5); // 15W:2, 20W:3, 25W:4
    } else if (wave >= 30) {
        let baseCount = 4; // 25~29웨이브에서의 마릿수
        let doubleTiers = Math.floor((wave - 30) / 5) + 1; // 30W: 1단계, 35W: 2단계...
        spawnBatchCount = baseCount * Math.pow(2, doubleTiers); // 30W: 8마리, 35W: 16마리...
    }

    waveTimer++;
    if (waveTimer % spawnInterval === 0 && spawnedCount < enemiesToSpawn) {
        for (let i = 0; i < spawnBatchCount; i++) {
            if (spawnedCount < enemiesToSpawn) {
                enemies.push(new Enemy());
                spawnedCount++;
            }
        }
    }

    if (spawnedCount >= enemiesToSpawn && enemies.length === 0) {
        wave++;
        spawnedCount = 0;
        enemiesToSpawn = 10 + wave * 3;
        gold += 50 + wave * 10;
        
        waveFirstEnemyChecked = false;
        targetCheatUpgrade = null;
        isCheatActive = false;
        hasUpgradedThisWave = false;
        
        updateUI();
    }

    tower.cooldown += 1 / 60;
    if (tower.cooldown >= (1 / tower.attackSpeed)) {
        let inRangeEnemies = enemies
            .map(e => ({ enemy: e, dist: Math.hypot(e.x - tower.x, e.y - tower.y) }))
            .filter(item => item.dist <= tower.range)
            .sort((a, b) => a.dist - b.dist);

        if (inRangeEnemies.length > 0) {
            let fireCount = Math.min(tower.targets, inRangeEnemies.length);
            for (let i = 0; i < fireCount; i++) {
                bullets.push(new Bullet(tower.x, tower.y, inRangeEnemies[i].enemy, tower.damage));
            }
            tower.cooldown = 0;
        }
    }

    particles.forEach((p, idx) => {
        p.update(); p.draw();
        if (p.alpha <= 0) particles.splice(idx, 1);
    });

    bullets = bullets.filter(b => {
        let hit = b.update();
        if (!hit) b.draw();
        return !hit;
    });

    enemies.forEach((e, idx) => {
        e.update();
        e.draw();

        if (Math.hypot(e.x - tower.x, e.y - tower.y) < (tower.baseRadius * scaleRatio) + (e.baseRadius * scaleRatio)) {
            tower.hp -= 10;
            createParticles(e.x, e.y, '#e74c3c');
            enemies.splice(idx, 1);
            updateUI();

            if (tower.hp <= 0) gameOver();
        }

        if (e.hp <= 0) {
            gold += e.reward;
            createParticles(e.x, e.y, '#2ecc71');
            enemies.splice(idx, 1);
            updateUI();
        }
    });

    ctx.beginPath();
    ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
    ctx.strokeStyle = isCheatActive ? 'rgba(168, 85, 247, 0.3)' : 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 2 * scaleRatio;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(tower.x, tower.y, tower.baseRadius * scaleRatio, 0, Math.PI * 2);
    ctx.fillStyle = '#6c5ce7';
    ctx.shadowColor = '#a29bfe';
    ctx.shadowBlur = 15 * scaleRatio;
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur = 0;
}

init();
animate();
</script>
</body>
</html>
